# 前端提示词条目骨架：复制成 制作文件/产物/frontend-prompt.yaml 后按界面填
# 只写"AI 该输出什么"，界面怎么渲染不写进来
条目:
  名称: "[待定：条目名，如「状态栏输出规范」]"
  插入位置: "[待定：API 预设的越狱后置 / 世界书常驻条目 / 角色卡开场白]"
  触发时机: "[待定：每轮回复末尾 / 仅开场一次]"
  内容: |
    [待定：给 AI 的原文。必须包含：标签名、字段清单、取值规则、不许解释。
    例：
    每次回复末尾输出以下块，字段值只能是数字或短词，不解释：
    <状态栏>
    <灯芯>72</灯芯>
    <潮压>0.42</潮压>
    </状态栏>]

字段:
  - 名称: "[待定：与数据块标签逐字一致]"
    类型: "[待定：整数 0-100 / 小数 0.00-1.00 / 短文本 ≤12 字]"
    来源: "[待定：axis-system.axes[<轴名>] 的当前值 / 场景卡的某节]"
    缺省: "[待定：未知]"
  - 名称: "[待定]"
    类型: "[待定]"
    来源: "[待定]"
    缺省: "未知"

一致性:
  标签: "[待定：正则 findRegex 的标签名 = HTML 的 TAG = 这里的 标签，三处逐字相同]"
  字段: ["[待定]", "[待定]"]          # HTML 的 FIELDS = 这里的 字段，两处逐字相同
入口:                                  # 仅开局界面需要，状态栏删掉本段
  格式: "显示文本|实际发送"
  条数: 3
  发送方式: "触发 /send，正文即实际发送内容"
