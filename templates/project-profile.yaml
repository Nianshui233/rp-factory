# 【项目档案 / Project Profile】骨架 —— 制作文件/项目记录/项目档案.yaml
# 定位：项目级的元信息与基调，供作者与 AI 自查用，**不进导入包**。
#      四份产物（world-bible / rolecard / scene-sheet / axis-system）都不含这两块。
# 联动：基调红线 与 本文档对AI的核心指令 必须同时写一份进 contract.hard_settings（source: 用户确认），
#      否则下游阶段读不到、约束失去强制力。
# 终稿移除全部 # 注释行。

元信息:
  文档用途: ""                     # 如：供 AI 角色扮演时作为世界观约束参考
  文档版本: ""                     # 如：v0.1-粗版 / v1.0-终稿
  RP形式: ""                       # 1v1 / 多人 / 跑团风格 / 旁白主导；与 contract.project.rp_form 同值
  本文档对AI的核心指令: ""          # 例："严格遵守硬设定；冲突时硬设定优先；秘密信息不得被普通角色引用"
  原型说明: ""                     # 可选。本世界参照的原型作品/类型坐标，只作参考不照搬
  兼容性说明: ""                   # 可选。可移植到哪些平台/卡型、有哪些依赖需先装（如 MVU 变量框架）
  文档语言: ""                     # 如：简体中文；产物内所有字段名与正文都用此语言
  变更记录: []                     # 可选。例：["v0.3：用户确认魔法稀有度<1%为硬设定"]

类型与基调:
  类型: ""                         # 例：奇幻 / 赛博朋克 / 校园日常 / 克苏鲁 / 历史架空 / 太空歌剧 / 混合(XX+XX)
  子类型: []                       # 可选。例：["政治阴谋", "冒险探索", "生存恐怖"]
  基调: ""                         # 轻松 / 黑暗 / 热血 / 悬疑 / 浪漫 / 写实
  基调补充说明: ""                 # 可选。如"整体黑暗但允许局部温情"
  叙事风格标签: ""                 # 可选。如"日式动画+日式轻小说" / "史诗奇幻+权谋" / "赛博朋克+黑色电影"
  基调红线: ""                     # 可选。绝对不能偏离的基调底线。如"不可变为喜剧" / "不允许无节制的乐观结局"
