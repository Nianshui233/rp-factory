# 【场景卡 / Location Sheet】骨架
# 根键 <场景名称> 换成具体场景名（去掉尖括号）；终稿移除全部 # 注释行；
# 某块对本场景不适用则整段移除，不留 [不适用] 残迹。
# 括号里的提示是填写时才需要的，渲染前剥掉。

<场景名称>:

  概览:
    场景名称: ""
    场景类型: ""                     # 例：旅馆/医院/飞船/森林/遗迹/街区/公司大楼/地牢/集市/神殿/竞技场
    所属地域与世界观锚点: ""          # 与世界观中的国家/城市/势力/地标如何关联
    用途: ""                         # 此场景在剧情中的功能：会面、潜入、交易、审讯、避难、探索、战斗、推理
    基调与观感关键词: []              # 3–8 个
    危险等级: ""                     # 无 / 低 / 中 / 高 / 致命
    访问门槛: ""                     # 公开 / 需邀请 / 需凭证 / 禁区

  空间结构:
    总体规模: ""                     # 例：单房间 / 单建筑 / 街区 / 整座设施 / 野外区域半径X公里
    空间拓扑: ""                     # 用文字描述连通关系，例：入口→大堂→走廊→A区/B区；或"东西两翼+中央枢纽"
    楼层与区域分层:                   # 如适用
      B层: ""
      1F: ""
      2F: ""
      3F以上: ""
    关键通道:
      主通道: ""
      备用通道: ""
      垂直通道: ""                   # 楼梯 / 电梯 / 梯井 / 传送点
    不可即兴改动的空间事实: []        # 例：只有一个消防通道；某扇门永远上锁；某区域必须刷卡

  关键区域:                          # 建议 5–12 个
    区域列表:
      - 名称: ""
        功能: ""
        现场可见: ""                   # 默认信息，角色一进来就能看到的
        可互动点: []                   # 机关 / 道具 / 装置 / 线索
        风险与限制: []                 # 噪音 / 视线 / 门禁 / 污染等
        连接到: []                     # 相邻区域名
      - 名称: ""
        功能: ""
        现场可见: ""
        可互动点: []
        风险与限制: []
        连接到: []
      - 名称: ""                       # 可选，第三项留作格式示例，实际按需增删
        功能: ""
        现场可见: ""
        可互动点: []
        风险与限制: []
        连接到: []
    其他未命名区域的生成规则: ""       # 扩展用，例：标准客房层每层20间、每层都有服务间与安全出口、越高层安保越强

  出入口与安防:
    出入口列表:
      正门与主入口: ""               # 位置、可见性、管制
      侧门或员工通道: ""
      货运口或后门: ""
      紧急通道: ""                   # 消防 / 逃生 / 维护井
    门禁与权限体系:
      权限等级: ""                   # A/B/C 或 1/2/3
      获取方式: ""                   # 购买 / 偷取 / 伪造 / 社工 / 任务奖励
      失败后果: ""                   # 报警 / 驱逐 / 记录 / 战斗
    监控巡逻与感知机制:
      监控覆盖: ""                   # 大致范围
      巡逻路线与频率: ""
      触发警报的条件: ""
      可规避方式: ""                 # 必须合理且可判定

  生态:
    常驻者与管理者:
      身份与动机: ""
      可交易或可谈判点: ""
    关键NPC:                         # 0–5 个
      - 名字或代号: ""
        立场: ""
        目标: ""
        掌握信息: ""
        弱点: ""
    普通人群与生物生态: ""            # 例：客流量、居民、野生动物、异化体的活动规律
    与势力的关系: ""                  # 例：被某组织控制；表面中立；暗中走私

  资源与可破坏物:
    可获得资源: []                   # 补给、武器、材料、信息、交通工具等
    关键道具与关键资源:
      - 名称: ""
        用途: ""
        获取条件: ""
        使用限制: ""
        代价: ""
    可破坏与可改造点: []              # 门/窗/供电/管线/地形/承重结构，写清后果

  线索:
    核心秘密与真相: ""                # GM 信息，不对角色公开
    线索分布:                        # 至少 3 条
      - 线索内容: ""
        所在区域: ""
        获取方式: ""
        可能误导: ""
      - 线索内容: ""
        所在区域: ""
        获取方式: ""
        可能误导: ""
      - 线索内容: ""
        所在区域: ""
        获取方式: ""
        可能误导: ""
    目击者与时间窗: ""                # 谁在何时何地看到什么

  时间与事件:
    时间段差异:
      白天: ""
      夜晚: ""
      换班闭店宵禁: ""
    随机事件表: []                   # 可选 3–8 条，每条 {触发条件, 发生事件, 影响}
    必然事件: []                     # 剧情推进用，触发条件须明确，不强行推动

  规则:
    特殊规则: []                     # 在此场景生效、与世界规则并行的规则，例：反魔力场 / 通讯受干扰 / 重力异常 / 枪械管制
    常见行动判定口径: ""              # 例：撬锁难度、潜行可行性、战斗会不会引来增援
    明确禁止或无法实现的事情: []      # 必须与世界观硬规则一致

  边界:
    硬设定: []                       # 不可改
    软设定: []                       # 允许即兴补全，不得与硬设定矛盾
    不允许出现的剧情走向与元素: []    # 与用户内容边界一致
