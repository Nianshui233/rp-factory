# 契约骨架 · contract.yaml
# 放到 <工作区>/<世界名>/创作痕迹/contract.yaml，按阶段填写。键名与 references/contract-schema.md 逐字一致，不要改。
# 契约是索引与命名权威，不是产物正文。世界观正文、心理层、计算公式一律不进这里。

project:
  name: ""                 # 项目文件夹名 = 世界 / 作品名；未定名时写「未命名项目」
  workspace: ""            # 用户确认的工作区绝对路径；项目路径 = <workspace>/<name>/
  mode: "text"             # text | engineering
  rp_form: ""              # 1v1 / 多人 / 跑团风格 / 旁白主导
  language: "zh"           # 描述性内容的语言
  stages_requested: []     # 开局多选的结果，按执行顺序写名字：world / cast / scenes / axes / mvu / ejs / opening / statusbar
  web_research: false      # 开局第四问：是否联网检索；true 时每次落笔前都先搜，走 references/web-research.md
  source_ip: ""            # 可选：检索依据（原作名+版本 / 真实年代地点 / 专业领域）。自动记录，不为此提问
  sillytavern:             # 开局静默探测的结果（scripts/detect-sillytavern.py），不为此提问；没探测到写 null
    install: ""            # 安装目录绝对路径
    user_dir: ""           # data/<用户名> 目录
    running_url: ""        # 正在跑的实例，如 http://127.0.0.1:8000；没在跑写 ""
    pkg_version: ""        # 实例或安装包的版本号
    extension_tavern_helper: false   # 有没有装酒馆助手（阶段 5/6 的前置）

stages:                    # 每阶段状态，名字键，不是标量。顺序即执行顺序，乱序进入合法。
  world: none              # none | partial | done | skipped（未勾选的阶段写 skipped）
  cast: none               # 角色卡
  scenes: none             # 场景卡
  axes: none               # 数值系统
  mvu: none                # 变量系统：把轴投影成 zod + initvar + 三条目（必须在 ejs 前）
  ejs: none                # 分档控制器：按数值切条目（默认不建，命中判据才建）
  opening: none            # 开局前端
  statusbar: none          # 状态栏前端
  delivery: none           # 交付/打包：只在最后一次进入；选原生路线写 skipped

delivery:                  # 收尾问一次：交付到哪（不选就按 native）
  route: "native"          # native（把 创作痕迹/产物/ 复制进 最终产物/）| st（三件套）| both
  st_name: ""              # 角色卡名，默认 = project.name；世界书名 = "<st_name> 世界书"（= 文件名）
  files: []                # 相对 最终产物/ 的文件名列表：<st_name>（纯净）.json / 正则.json / <st_name> 世界书.json

content_boundaries:        # 边界门：任何产物落笔前必须锁定（开局问完即可锁）
  nsfw: false              # 开局第三问；false 时 rating 写一般向，hard_no 加“任何性描写”
  rating: ""               # 全年龄 / R15 / R18 / 自定义；nsfw: true 时必须给明确档位
  hard_no: []              # 明确不出现的元素；nsfw: false 时至少含“任何性描写”
  soft_no: []              # 尽量不出现，但可为叙事让步

naming:                    # 命名门的事实源：同一实体在所有产物里用同一个名字
  world: ""
  factions: []             # - {id: "", name: "", alias: []}
  places: []               # - {id: "", name: "", scope: ""}
  systems: []              # 超自然 / 科技系统，- {id: "", name: "", ceiling: ""}
  axes: []                 # - {name: "", range: [], initial: 0, provisional: true, levels: [], targets: []}
                           #   provisional 只在阶段 2/3 先行写名时为 true；阶段 4 接管后删除该键
  schema_axes: []          # 阶段 mvu 实际投影进 zod 的轴名；交付校验 X02 用它查轴有没有漏在包外
  ui_tags:                 # 表现层的消息标签名；写定后不与正则、HTML 的 TAG 分离
    opening: ""            # 阶段 5 写「开局界面」
    status: ""             # 阶段 6 写「状态栏」

hard_settings: []          # 已锁定、不可改
  # - id: H01
  #   text: ""
  #   source: "用户确认"     # 用户确认 | 推导（推导项不算锁定）
  #   locked_at_stage: 1

pending: []                # [待定…] 汇总，- {stage: 1, item: "", why: ""}（partial 阶段必须有一条）

decisions: []              # 谁拍的板，- {stage: 1, question: "", answer: "", why: "", state: confirmed}
  # state: confirmed 用户说了要 / proposed 我替用户定的（必须写 why）/ pending 悬着 / rejected 被否掉
  # 也收过程决策 {date, item, choice, because, state}；四态规则见 references/decisions.md

artifacts: []              # 产物索引，正文不在这里
  # - type: world-bible    # project-profile | world-bible | rolecard | scene-sheet | axis-system
  #                        # | mvu-schema | mvu-initvar | mvu-entries | mvu-regex | ejs-controller
  #                        # | opening-ui | statusbar-ui | st-card | st-regex | st-worldbook
  #   path: ""             # 相对项目根，运行期一律在 创作痕迹/产物/ 下；文本模态留空（多文件产物写目录，如 创作痕迹/产物/rolecard/）
  #   inline_ref: ""       # 文本模态写产物在会话里的标识
  #   version: 1
