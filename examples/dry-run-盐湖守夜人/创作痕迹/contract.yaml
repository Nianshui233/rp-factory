    - "对未成年角色的性描写"
    - "以自伤作为卖点"
  soft_no:
    - "长篇虐待描写"

naming:
  world: "白潮"
  factions:
    - {id: "faction_watch", name: "守夜所", alias: ["灯所"]}
    - {id: "faction_salters", name: "拾盐人公行", alias: ["公行"]}
    - {id: "faction_tidecult", name: "湖心教团", alias: ["归潮会"]}
  places:
    - {id: "loc_salttown", name: "白盐镇", scope: "堤线以内最大聚居地"}
    - {id: "loc_seventower", name: "第七塔", scope: "堤线最末哨塔，已熄灯十二年"}
    - {id: "loc_lakeisland", name: "湖心盐岛", scope: "盐潮发源处，禁入"}
  systems:
    - {id: "system_tide", name: "盐潮", ceiling: "漫过第七塔以北堤线后不可阻挡"}
    - {id: "system_lamp", name: "盐晶灯", ceiling: "单灯照程约三百步，七塔同燃方成线"}
  axes:
    - {name: "wick", range: [0, 100], initial: 68, levels: ["清醒", "磨损", "空壳"]}
    - {name: "tide", range: [0, 100], initial: 22, levels: ["静潮", "压潮", "漫潮"]}
  ui_tags:
    opening: "建卡向导"
    status: "状态栏"

hard_settings:
  - id: H01
    text: "点灯必须烧掉点灯者的一段具体记忆，不可逆，不可转嫁他人"
    source: "用户确认"
    locked_at_stage: 1
  - id: H02
    text: "盐潮不能穿过七塔同燃的堤线；熄灭一塔，缺口即刻生成"
    source: "用户确认"
    locked_at_stage: 1
  - id: H03
    text: "第七塔自十二年前熄灭后未再点燃，缺口靠巡堤人力勉强补住"
    source: "用户确认"
    locked_at_stage: 1
  - id: H04
    text: "本文档对AI的核心指令：严格遵守硬设定；冲突时硬设定优先；秘密信息不得被普通角色引用；盐潮的意志不可被台词化解释"
    source: "用户确认"
    locked_at_stage: 1
  - id: H05
    text: "基调红线：不可变为解谜爽文；盐潮不得被彻底解释或消灭"
    source: "用户确认"
    locked_at_stage: 1
  - id: H06
    text: "每轮回复末尾必输出 <状态栏> 块；灯芯与潮压只写 0-100 整数，不可知写「未知」"
    source: "用户确认"
    locked_at_stage: 6
  - id: H07
    text: "角色卡「第一条消息」固定为 <建卡向导>；该标签由建卡向导正则吃掉，不进正文"
    source: "用户确认"
    locked_at_stage: 5

pending:
  - {stage: 3, item: "第七塔北侧堤墙的裂缝宽度", why: "用户未定，按可修复处理"}

decisions:
  - {stage: 1, question: "盐潮是自然现象还是有意志", answer: "有意志但不可沟通", why: "用户选此项，让悬疑不落到'讲道理'上"}
  - {stage: 2, question: "角色的核心驱动", answer: "追回被拿走的记忆而非复仇", why: "用户否掉了复仇线，避免与教团冲突重复"}
  - {stage: 4, question: "灯芯值是否可回升", answer: "不可回升，只能靠他人代烧", why: "用户要'烧掉就没有'的压迫感"}
  - {stage: 5, question: "开局前端做哪种形态", answer: "建卡向导（8 步：序章+6 组字段+总览）", why: "用户要先捏人再进故事，且要能把档案粘回去给阶段 2 重建"}
  - {stage: 5, question: "向导怎么触发", answer: "角色卡开场白即触发词 <建卡向导>", why: "开场白是唯一必然出现的一楼，触发最稳，用户一进聊天就能看见"}
  - {stage: 5, question: "向导配色", answer: "盐白底 + 灯黄强调", why: "与状态栏同源；向导是第一次见面，视觉先立住白潮的调"}
  - {stage: 6, question: "状态栏跟随本楼还是最新楼", answer: "本楼（每楼留快照）", why: "长线回看时能看出灯芯是何时掉的"}
  - {stage: 6, question: "变化要不要显示箭头", answer: "显示", why: "灯芯只降不升，箭头是最省字的压迫感来源"}
  - {stage: 6, question: "面板形态与配色", answer: "细长横条 + 夜蓝底暗黄光", why: "与场景卡的夜战与盐晶灯同调；不做折叠，免得用户多点一次"}
  - {stage: 7, question: "交付形态", answer: "两者都要（原生产物 + 酒馆包）", why: "用户要能直接在酒馆里跑，也要留 YAML 方便自己改"}
  - {stage: 7, question: "first_mes 取什么", answer: "<建卡向导>", why: "阶段 5 做的是向导形态，开场白即触发词，与 regex-opening.json 的 findRegex 对得上"}
  - {stage: 7, question: "正则怎么带", answer: "卡内嵌 + 独立 regex-*.json 都给", why: "内嵌省事但要弹窗允许；全局导入不弹窗但作用于所有角色，两条路都留"}

