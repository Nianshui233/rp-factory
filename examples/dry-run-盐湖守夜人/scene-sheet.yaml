第七塔:

  概览:
    场景名称: "第七塔"
    场景类型: "哨塔（堤线最末一座）"
    所属地域与世界观锚点: "白潮 · 堤线末端，隶属守夜所；北侧三百步为缺口"
    用途: "值守、潜入、审讯、调查旧案"
    基调与观感关键词: ["盐霜", "灯油烟", "铁锈", "空旷", "回声"]
    危险等级: "高"
    访问门槛: "需凭证（守夜所钥匙）"

  空间结构:
    总体规模: "单座四层石塔 + 塔基平台 + 北侧堤墙残段"
    空间拓扑: "塔基平台→一层门厅→环形石梯→二层值守间→三层灯室→顶层瞭望台；塔基北侧缺口直接连堤墙残段"
    楼层与区域分层:
      B层: "地窖，存灯芯与旧档，仅一层有暗门可下"
      1F: "门厅与登记台，门是唯一的铁门"
      2F: "值守间，睡铺、炭盆、墙上钉着十二年前的班次板"
      3F: "灯室，盐晶灯本体，四面开窗，无门只有帘"
      3F以上: "顶层瞭望台，无遮蔽，哨声从这里发出"
    关键通道:
      主通道: "塔基平台 → 一层铁门 → 环形石梯"
      备用通道: "塔基东侧检修梯，直通三层灯室外窗，锈蚀，承重有限"
      垂直通道: "环形石梯（无电梯）；地窖靠一层暗门木梯"
    不可即兴改动的空间事实: ["全塔只有一层一道铁门", "三层灯室没有门，只有厚帘", "北侧堤墙的裂缝在塔基外三十步，无法从塔内看到"]

  关键区域:
    区域列表:
      - 名称: "一层门厅"
        功能: "登记与查验，所有进出必经"
        现场可见: ["登记簿翻到最后一页", "墙上一排七把钥匙挂钩，缺一把", "地上一道被拖过的痕迹"]
        可互动点: ["登记簿", "钥匙挂钩", "一层暗门（铁皮盖，需撬）"]
        风险与限制: ["铁门开合声在塔内回声极大", "无光时地窖口完全看不见"]
        连接到: ["塔基平台", "环形石梯", "地窖"]
      - 名称: "三层灯室"
        功能: "盐晶灯本体所在，全塔核心"
        现场可见: ["灯座上的盐晶碎裂成四块", "窗框内侧重重的油烟痕", "地面一圈焦痕，直径约两步"]
        可互动点: ["灯座", "四块碎芯（可拼，拼起来能看见芯里的刻字）", "东窗外检修梯"]
        风险与限制: ["灯室四面开窗，夜间任何火光都会被堤线上看到", "灯油味会引来失名者"]
        连接到: ["环形石梯", "顶层瞭望台", "塔基东侧检修梯"]
      - 名称: "地窖"
        功能: "存灯芯与旧档，也是旧案物证的唯一存放处"
        现场可见: ["数十个空木箱", "靠墙一排铁皮档案柜，其中一个锁被撬过", "地面返潮，盐结晶成柱"]
        可互动点: ["十二年前的班次册", "岑鹤年的签署页", "被撬档案柜"]
        风险与限制: ["地窖缺氧，火把会暗下去，判断不了是缺氧还是潮来了", "木梯腐朽，负重超过一人会断"]
        连接到: ["一层门厅"]
    其他未命名区域的生成规则: "塔基平台沿堤墙延伸，每五十步一处哨位桩；桩上必有哨牌与半壶水，桩与桩之间无遮蔽；越往北桩越稀，缺口段每百步才有桩"

  出入口与安防:
    出入口列表:
      正门与主入口: "塔基平台西侧，铁门一道，可见性极高，白天必有人值守"
      侧门或员工通道: "无"
      货运口或后门: "无；灯芯由人背上三层"
      紧急通道: "东侧检修梯，锈蚀，夜间无照明，可从三层灯室翻出"
    门禁与权限体系:
      权限等级: "A（守夜所高层）/ B（守夜人）/ C（巡堤人）"
      获取方式: "B 级靠誓约牌；C 级靠巡堤队牌；A 级靠钥匙，七把钥匙缺的正是 A 级那把"
      失败后果: "被撞见无牌进入 → 记录在案 → 次日由守夜所'请去谈一次'"
    监控巡逻与感知机制:
      监控覆盖: "无监控；靠塔顶瞭望与堤线哨声"
      巡逻路线与频率: "巡堤人沿堤墙由南向北，每两时辰过塔基一次，全程约一炷香"
      触发警报的条件: "塔内出现火光而塔顶未报；或铁门在非换班时段开合"
      可规避方式: "从东侧检修梯上三层可完全避开塔顶视野；铁门开合可用盐袋垫缝消声"

  生态:
    常驻者与管理者:
      身份与动机: "塔里常驻一人，次席守夜人祁昭；他要重燃此塔，同时查十二年前的旧案"
      可交易或可谈判点: "可谈'替你守一夜'，但要求对方立誓；不接钱"
    关键NPC:
      - 名字或代号: "祁昭"
        立场: "守夜所内部，不站派系"
        目标: "重燃第七塔并查清旧案"
        掌握信息: "知道那夜塔里七人只他一人还记得自己的名字"
        弱点: "母亲的记忆是他最后的完整记忆，一提就乱"
      - 名字或代号: "老邵"
        立场: "巡堤队老兵"
        目标: "熬到春分"
        掌握信息: "看过北侧裂缝从一指宽到一掌宽的全程"
        弱点: "怕被调去缺口段，家里有瘫在床上的老婆"
    普通人群与生物生态: "白天有盐车经过塔基；入夜后失名者会沿堤墙游荡，不攻击人，但会重复念别人的名字"
    与势力的关系: "被守夜所控制；公行只在送芯时来；教团从不进塔，只在塔基外讲经"

  资源与可破坏物:
    可获得资源: ["半箱灯芯（约十二根）", "地窖里的旧档", "巡堤人的哨牌", "半壶水与干盐饼"]
    关键道具与关键资源:
      - 名称: "四块碎芯"
        用途: "拼合后可读芯里刻的年份与姓名缩写"
        获取条件: "需从灯座逐块取出，动作过大会碎成粉"
        使用限制: "拼合后不能点亮，只能读"
        代价: "拼合需用炭火烤，火一进灯室就会被堤线看到"
      - 名称: "十二年前的班次册"
        用途: "证明第七塔熄灯当夜的值守名单与签署人"
        获取条件: "地窖被撬的档案柜内"
        使用限制: "缺三页，缺的正是熄灯那一夜"
        代价: "取出后守夜所会知道有人查过"
    可破坏与可改造点: ["铁门（可撬，撬后无法复原，等于自证入侵）", "东侧检修梯（砍断即断绝唯一隐蔽通道）", "灯座（损坏后重燃需另铸座，工期一季）", "北侧堤墙（可补缝，补一次烧一段记忆）"]

  线索:
    核心秘密与真相: "十二年前熄灯是人为的：当时的记录员岑鹤年为了压住一次采集事故，签字调走了当夜的灯芯；塔里七人只祁昭一人在熄灯前恰好离开了灯室"
    线索分布:
      - 线索内容: "班次册缺三页，撕口是从内侧撕的"
        所在区域: "地窖"
        获取方式: "开被撬的档案柜"
        可能误导: "容易被读成外人闯入"
      - 线索内容: "四块碎芯里刻着'退历二十八'与'岑'字的一半"
        所在区域: "三层灯室"
        获取方式: "拼合碎芯并炭火烤"
        可能误导: "可被读成刻字的是值守者而非签署人"
      - 线索内容: "钥匙挂钩缺的是 A 级那把，缺口处有新磨痕"
        所在区域: "一层门厅"
        获取方式: "近距离查看挂钩"
        可能误导: "看起来像最近有人取用，实为常年不挂"
      - 线索内容: "老邵记得那夜塔顶哨声是三短一长——那是'暂离'的哨，不是'敌袭'"
        所在区域: "堤墙哨位桩"
        获取方式: "与老邵深谈，需先替他解决调岗"
        可能误导: "三短一长也可能被记成'增援'"
    目击者与时间窗: "老邵在熄灯当夜子时过塔基，看到三层灯室有人影离开；窗口只持续约十息"

  时间与事件:
    时间段差异:
      白天: "盐车经过，塔基有人，适合正面接触；不适合潜入"
      夜晚: "巡堤人两时辰一过；失名者沿墙游荡；任何火光都会被看见"
      换班闭店宵禁: "子时换班，塔内值守者会有约一炷香的空档"
    随机事件表:
      - {触发条件: "在塔内点任何明火", 发生事件: "堤线哨声起，巡堤人前来查火", 影响: "当夜无法继续调查，次日被记录"}
      - {触发条件: "在灯室停留超过半个时辰未添芯", 发生事件: "失名者聚到塔基下重复念名字", 影响: "塔内人听见自己名字被念，压力累积"}
      - {触发条件: "下地窖未带火把", 发生事件: "缺氧加黑暗，判断不了潮位", 影响: "出窖时可能已错过一次潮声"}
    必然事件: ["春分前三夜，盐潮必至压潮级；此塔若未燃，缺口段必须有人以人力抵半塔效力"]

  规则:
    特殊规则: ["塔内不许说全名——说了的当夜必然想起某段记忆，然后失去它", "地窖缺氧，明火会变暗，与潮压无关，不可用作潮位判断"]
    常见行动判定口径: "撬一层暗门：需铁器与两刻钟，成功则无声；翻东侧检修梯：负重超六十斤必断；在灯室点明火：必被堤线发现；读碎芯：需炭火，等于点明火"
    明确禁止或无法实现的事情: ["从塔内看到北侧裂缝", "在塔内重新点燃盐晶灯而不烧记忆", "让失名者进入塔内而不引发名字被念"]

  边界:
    硬设定: ["全塔只有一道铁门", "三层灯室无门只有帘", "灯座已碎，重燃需另铸座"]
    软设定: ["地窖档案柜的具体数量", "失名者的人数", "巡堤人的姓名"]
    不允许出现的剧情走向与元素: ["让祁昭在塔内一次性想起全部旧案", "让盐潮在塔内被彻底解释", "以自伤换取线索"]
