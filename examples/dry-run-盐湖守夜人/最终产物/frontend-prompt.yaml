条目:
  名称: "状态栏输出规范 · 白潮"
  插入位置: "API 预设的越狱后置"
  触发时机: "每轮回复末尾"
  内容: |
    每次回复末尾输出以下块，紧跟正文，不解释、不总结：
    <状态栏>
    <时间>潮历四十七年 · 第三次涨潮 · 夜</时间>
    <地点>第七塔 · 塔顶灯室</地点>
    <灯芯>72</灯芯>
    <潮压>42</潮压>
    </状态栏>
    灯芯与潮压只写 0 到 100 的整数，不带百分号与单位；不可知时写「未知」，不要写 0 或 -。
    时间与地点各不超过十六字，与正文里的时间地点一致。

字段:
  - 名称: "时间"
    类型: "短文本 ≤16 字"
    来源: "本楼正文里的时间"
    缺省: "未知"
  - 名称: "地点"
    类型: "短文本 ≤16 字"
    来源: "scene-sheet.yaml 的地点名 + 具体位置"
    缺省: "未知"
  - 名称: "灯芯"
    类型: "整数 0-100"
    来源: "axis-system.yaml axes[wick] 的当前值（descending，越低越危险）"
    缺省: "未知"
  - 名称: "潮压"
    类型: "整数 0-100"
    来源: "axis-system.yaml axes[tide] 的当前值（bidirectional，越高越临近漫潮）"
    缺省: "未知"

一致性:
  标签: "状态栏"
  字段: ["时间", "地点", "灯芯", "潮压"]
