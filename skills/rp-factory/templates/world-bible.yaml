# 【RP设定卡 / World Bible】骨架
# 用法：根键 <世界名称> 换成具体世界名（去掉尖括号）；终稿移除全部 # 注释行与被注释掉的可选结构；
#      某模块对本世界不适用则整段移除（原则 14）。
# 注意：世界卡的「元信息」与「类型与基调」不在终稿里，它们在 制作文件/项目记录/项目档案.yaml（模板 templates/project-profile.yaml）。
#
# 写作对照示例（原则 2 / 4 / 7 / 风格 2 的例子集中在此，正文只留规则句）
#   规则式 vs 叙事式
#     好：平民无法使用魔法；拥有魔力的人占总人口不到 1%
#     差：魔法是一种稀有的天赋，自古以来只有少数人被神选中……
#   冲突优先级
#     当物理防御规则与魔法穿透规则冲突时，以魔法等级高者优先。
#   边界案例默认裁决
#     若施法者同时满足两个互斥的触发条件，默认取对施法者不利的结果。
#   代价式规则句
#     只要付出记忆，就可以发动一次时间回溯；代价是永久遗忘当天所有经历
#   等级对比式表达
#     初级魔法可治疗擦伤；中级可接骨止血；高级可再生器官；禁忌级可复活死者（代价：施术者寿命减半）
#   硬设定确认话术
#     已将 XX 锁定为硬设定。

<世界名称>:

  时间地点与世界范围:
    时代: ""                         # 例：中世纪相当技术水平 / 近未来 / 20XX年 / 架空朝代
    主要地点:
      - id: ""
        名称: ""
        简介: ""                     # 一句话定位
        特殊规则: ""                 # 可选。该地点独有的规则/限制
        信息层级: ""                 # 可选。公开 / 半公开 / 秘密
        关联势力: ""                 # 可选。控制或影响该地点的势力 id
    世界范围: ""                     # 单城 / 单国 / 单大陆 / 多世界 / 宇宙级
    环境与资源基调:
      气候与地貌: ""
      资源是否稀缺: ""               # 是 / 否
      关键稀缺资源: ""               # 可选。具体指出什么稀缺
      日常技术水平: ""               # 例："有基础电力与机械；大众无网络"
      交通方式与速度: ""
      通讯方式: ""
      人口规模: ""                   # 可选。大致量级即可
      环境威胁: ""                   # 可选。自然灾害、野生怪物、环境污染等

  信息分层:                           # 强烈建议保留，用于防剧透
    公开信息(角色可知): []
    半公开信息(需调查或权限): []
    秘密信息(仅旁白或高层可知): []
    秘密信息引用规则: ""               # 例："普通角色不得引用秘密信息；仅在调查成功或身份满足时揭示"
    信息揭示触发条件: []               # 可选。例：["角色在图书馆调查3次以上可获知XX", "加入XX组织后可知XX"]
    信息泄露处理: ""                   # 可选。角色意外获知超权限信息时的处理方式
    虚假信息与谣言: []                 # 可选。世界中广泛流传的错误信息，可用于剧情

  张力从哪来:                        # 旧版叫「核心矛盾」；读旧产物时按同一块处理
    张力形态: ""                      # 单一引擎 / 多源日常 / 任务线。情景喜剧与沙盒通常是「多源日常」，不要硬造一个总引擎
    当前局势: ""                      # 世界/社区/舞台正在发生的核心事态
    矛盾各方:
      - id: "side_a"
        名称: ""
        目标: ""
        手段: ""
        弱点或内部矛盾: ""            # 可选。利于 RP 深度
        底线: ""                      # 可选。该方绝对不会做的事
      - id: "side_b"
        名称: ""
        目标: ""
        手段: ""
        弱点或内部矛盾: ""
        底线: ""
    矛盾升级路径: ""                  # 可选。如"若无人干预，3个月内将爆发全面战争"
    日常张力: []                      # 多源日常用：房租 / 钱 / 工作 / 面子 / 谁做饭
    关系张力: []                      # 多源日常用：谁跟谁有过什么、谁在瞒谁
    外部张力: []                      # 多源日常用：物业、房东、单位、家里
    个人层面的典型冲突: []             # 可选。例：["家族利益与个人感情冲突", "同门争夺继承权"]
    矛盾解决的可能途径: []             # 可选。2–3种可能的解决方向（不锁定结局）
    次要矛盾: []                      # 可选。与核心矛盾并行的次要冲突线

  世界怎么运转:                      # 沙盒 / 日常题材必备：这是给 AI 的职责说明书，不是设定注释
    沙盒还是任务: ""                  # 沙盒 = 世界自发动、玩家自找事；任务 = 有明确目标线
    AI的职责: []                      # 例：维持每个人的作息与在场；每场戏至少给一个可接的话头；不打圆场
    世界自发的动静: []                # 没人推动时也会发生的事：邻居吵架、物业贴通知、单位加班
    卡住时的兜底: []                  # 玩家不动时怎么推进：有人敲门 / 电话响 / 有人闯进来
    不做什么: []                      # 例：不替玩家做决定；不把日常写成议题剧；不无端制造灾难

  日常生活的质地:                    # 可选但强烈建议：它决定"这个世界摸起来是什么样"
    一天的节奏: ""
    吃什么: ""
    钱怎么周转: ""
    怎么玩: ""
    传闻怎么流: ""

  世界规则:
    关键系统:                         # 适配魔法/科技/超自然/法律/网络等；建议≤3套
      - id: ""                        # 例：system_magic
        系统名: ""                    # 例："魔法", "灵能", "义体改造", "契约律"
        系统类型: ""                  # 超自然 / 科技 / 社会制度 / 混合
        能量或资源来源: ""
        使用方式与门槛: ""            # 谁能用、需要什么条件
        学习或获取途径: ""            # 可选。如何获得使用资格
        可实现的上限: ""
        明确禁止或无法实现的事情: ""
        典型用法示例: []              # 可选。2–3个具体场景，帮助AI理解实际运用
        等级或层级划分: ""            # 可选。如"初级/中级/高级/禁忌级"
        常见误解或谣言: ""            # 可选：用于剧情与信息差
        边界案例与默认裁决: []        # 可选。1–2个模糊场景及其处理方式
        与其他系统的交互: ""          # 可选。如"魔法可增强科技装备但不可替代其功能"
    代价与限制:
      代价: ""                        # 如体力、寿命、记忆、金钱、道德、社会后果
      冷却或次数限制: ""
      反噬或风险: ""
      累积效应: ""                    # 可选。长期使用的额外后果
      社会层面的代价: ""              # 可选。使用该系统带来的社会偏见/法律风险
    判定框架:
      默认判定方式: ""                # 叙事裁决 / 三段式(成功-部分成功-失败) / 资源对比 / 等级对比
      成功的默认后果: ""
      部分成功的默认后果: ""
      失败的默认后果: ""
      大失败或暴击: ""                # 可选。极端结果的处理
      信息不足时的处理: ""            # 例："保守裁决；不新增硬设定；以软设定即兴并记录"
      对抗裁决: ""                    # 可选。角色vs角色、角色vs环境的对抗如何判定
      连续行动裁决: ""                # 可选。同一角色连续多次行动时的累积效应或递减规则
    规则冲突裁决: ""                  # 冲突优先级或裁决原则
    规则递归终止: ""                  # 可选。"当规则嵌套无法判定时，由旁白按叙事合理性裁决"
    战斗与伤害常识:
      治疗难度: ""                    # 易 / 中 / 难 / 不可逆
      死亡是否常见: ""                # 是 / 否
      死亡的可逆性: ""                # 可选。是否有复活手段及其代价
      武器或装备强度层级: ""
      失败代价: ""                    # 例：死亡/名誉受损/资源损失/关系破裂
      非致命冲突手段: []              # 可选。如"决斗可以点到为止" / "法律诉讼"
    稀有资源或关键道具规则:
      产出途径: ""
      管制程度: ""                    # 强 / 中 / 弱 / 无
      可替代性: ""                    # 高 / 中 / 低 / 不可替代
      黑市与走私: ""                  # 可选
      资源与势力的关系: ""            # 可选。谁控制主要资源产出

  种族与物种:                         # 若仅有人类可整段移除
    - id: ""
      名称: ""
      别名: []
      生理特征: ""
      寿命范围: ""
      固有能力或限制: ""
      社会地位: ""
      与其他种族的关系: ""
      人口比例: ""                    # 可选
      文化特征: ""                    # 可选。一句话概括文化倾向
      可扮演性: ""                    # 可选。是否适合作为PC/NPC。如"适合PC" / "仅适合NPC" / "禁止扮演"

  势力与社会结构:
    势力列表:
      - id: "faction_a"
        名称: ""
        别名: []
        公开形象: ""
        暗中目标: ""
        代表人物:                     # 关键 NPC，可为空
          - 名称: ""
            一句话定位: ""            # 例："教团枢机，暗中支持改革派"
            信息层级: ""              # 可选。该NPC的存在/身份是否为秘密
        关联机构: []                  # 下属或关联组织/部门名
        主要资源: ""
        控制区域: []                  # 可选。使用地点 id
        行事底线与禁忌: ""            # 可选：利于 RP 判定
        内部派系: []                  # 可选。势力内的分歧
        加入条件: ""                  # 可选。角色如何加入该势力
        退出代价: ""                  # 可选。背叛或离开的后果
      - id: "faction_b"
        名称: ""
        别名: []
        公开形象: ""
        暗中目标: ""
        代表人物: []
        关联机构: []
        主要资源: ""
        控制区域: []
        行事底线与禁忌: ""
        内部派系: []
        加入条件: ""
        退出代价: ""
    势力关系:
      整体格局: ""                    # 一句话描述，如 "三足鼎立，暗流涌动"
      双边关系:
        - 双方: ["faction_a", "faction_b"]   # 使用 id
          关系: ""                    # 盟友 / 友好 / 中立 / 冷和平 / 敌对 / 战争状态 / 表面合作 / 互相利用 / 附庸
          关系细节: ""                # 可选
          关系变动趋势: ""            # 可选。如"正在恶化" / "脆弱平衡"
          潜在冲突触发点: ""          # 可选。什么事件会改变双方关系
    社会阶层与日常秩序:
      阶层结构: ""                    # 如贵族/公司/宗教/军阀
      社会流动性: ""                  # 高 / 中 / 低 / 固化
      法律与治安强度: ""              # 强 / 中 / 弱
      司法与惩罚方式: ""
      边缘群体: ""                   # 可选。社会中被排斥或边缘化的群体及其处境

  AI即兴角色约束:                      # 仅约束 AI 即兴创作的 NPC/配角，不限制用户自建角色
    即兴角色能力上限: ""               # AI 即兴创作的角色能力范围上限
    即兴角色能力下限: ""               # 可选。避免 AI 创作过弱的工具人
    即兴角色成长规则: ""               # 可选。AI 创作的角色能否在剧情中成长
    背景归属倾向: ""                   # AI 即兴角色应优先归属哪些势力/种族/阶层
    禁止即兴创作的角色类型: []         # 例："禁止即兴创作神级存在" / "禁止即兴创作用户角色的直系亲属"
    即兴角色命名风格: ""               # 可选。命名规则或风格倾向
    即兴角色复用规则: ""               # 可选。已登场 NPC 的一致性与复用要求
    即兴角色性格多样性: ""             # 可选。避免所有NPC性格雷同的指引
    可选的即兴角色模板: []             # 可选：2–6 个模板供 AI 即兴参考
    # 模板详细格式（按需展开）：
    #   - 模板名: ""
    #     典型所属: ""
    #     能力范围: ""
    #     典型动机: ""
    #     登场场景建议: ""

  常识清单:
    民众普遍知道的常识: []
    禁忌与法律红线: []
    社会潜规则: []                    # 可选。不成文但人人遵守的规则
    日常生活细节: []                  # 可选。衣食住行的典型描写锚点
    货币与交易:
      货币单位: ""
      一般物价参考: ""                # 可选。给出2–3个锚定物价即可
      黑市与灰色交易: ""              # 可选
      常见职业与收入: ""              # 可选。帮助AI判定角色经济状况
    语言与文字:
      通用语: ""
      其他语言: []
      语言障碍规则: ""                # 可选。不通语言时如何处理
      书写与识字率: ""                # 可选
    宗教或信仰与文化礼仪:
      主流信仰: ""
      信仰与世界规则的关系: ""        # 可选。如"神确实存在且会回应" / "纯信仰无超自然效果"
      重要节日: []
      礼仪禁忌: []
      异端与邪教: ""                  # 可选。被主流社会排斥的信仰及其实际状况

  关键历史与时间线:
    纪元或历法说明: ""                # 可选。如"使用'新历'，以XX事件为元年"
    不可更改的大事件:
      - id: ""
        名称: ""
        时间: ""                      # 可选。在时间线中的位置
        描述: ""
        影响: ""                      # 对当下局势的直接影响
        信息层级: ""                  # 可选。公开 / 半公开 / 秘密
        关联势力: []                  # 可选。受此事件影响的势力 id
    当前年份与最近发生的事: ""
    即将爆发的危机: ""
    潜在的未来走向: []                # 可选。2–3个可能的发展方向，不锁定
    被遗忘或篡改的历史: []            # 可选。秘密信息层级的历史真相

  变更边界:
    硬设定: []                        # 不可改内容
    软设定: []                        # 允许即兴补全内容（不得与硬设定矛盾）
    鼓励探索的方向: []                # 例："欢迎发展地下势力间的暗中交易剧情"
    即兴补全的边界: ""                # 可选。AI 即兴补全时的总体约束。如"即兴补全不可引入新的超自然系统"

  跨世界规则:                          # 可选。仅在多世界/平行维度设定中使用
    维度数量与结构: ""
    跨维度移动规则: ""
    跨维度信息传递: ""
    各维度的核心差异: []
    跨维度的统一规则: ""               # 可选。所有维度共享的不变规则

  未决事项:                            # 最终版若仍未决，必须在此列出
    - 条目: ""
      位置: ""                        # 例："世界规则>关键系统[0]>可实现的上限"
      选项: ["选项A", "选项B", "选项C"]
      当前建议: ""                    # 可选：AI 给出的倾向（不替用户拍板）
      对RP的影响: ""                  # 可选：简述该未决项如何影响RP执行
      紧急程度: ""                    # 可选。"开局前必须决定" / "可在RP中逐步明确" / "不影响开局"
