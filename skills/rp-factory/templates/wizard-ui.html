<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ===== 一、语义层 =====
     三意象（宣纸 / 墨条 / 朱印）+ 一光源（台灯）：纸底墨字，只有朱印与靛青两个亮点。
     见 references/frontend-design.md 第一节。 */
  :root {
    --c-paper: #f2ece0;
    --c-paper-2: #eae2d2;
    --c-ink: #23201c;
    --c-mid: #6d6558;
    --c-line: #cfc4ae;
    --c-accent: #2f5468;      /* 靛青：可点、当前步 */
    --c-seal: #a4332a;        /* 朱印：必填、强调 */
    --f-title: "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", "SimSun", serif;
    --f-body: "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    --f-mono: ui-monospace, "SF Mono", Consolas, "Roboto Mono", monospace;
    --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px;
  }

  /* ===== 二、组件层 ===== */
  .rp-wz {
    box-sizing: border-box;
    font-family: var(--f-body); font-size: 14px; line-height: 1.7;
    color: var(--c-ink);
    background: var(--c-paper);
    background-image: repeating-linear-gradient(0deg, rgba(35, 32, 28, .02) 0 1px, transparent 1px 4px);
    border: 1px solid var(--c-line);
    border-top: 3px double var(--c-ink);
    box-shadow: 2px 2px 0 var(--c-line);
    max-width: 100%; border-radius: 2px;
  }
  .rp-wz * { box-sizing: border-box; }

  .rp-wz-head { padding: var(--s-4) var(--s-4) 0; display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s-3); }
  .rp-wz-title { margin: 0; font-family: var(--f-title); font-size: 21px; letter-spacing: .1em; }
  .rp-wz-sub { margin: var(--s-1) 0 0; font-size: 10px; letter-spacing: .26em; color: var(--c-mid); }
  .rp-wz-stamp {
    flex: none; padding: 2px 7px; font-family: var(--f-title); font-size: 11px; letter-spacing: .18em;
    color: var(--c-seal); border: 1px solid var(--c-seal); border-radius: 1px;
  }

  /* 步骤：编号 + 连线，不用胶囊（胶囊会把"进度"说成"标签"） */
  .rp-wz-steps { display: flex; align-items: center; gap: 0; padding: var(--s-4) var(--s-4) 0; flex-wrap: wrap; }
  .rp-wz-pill {
    font: inherit; font-size: 11px; letter-spacing: .06em; cursor: pointer;
    padding: 3px 2px; margin-right: var(--s-3);
    color: var(--c-mid); background: none; border: 0; border-bottom: 1px solid transparent;
  }
  .rp-wz-pill::before { content: attr(data-n) ". "; font-family: var(--f-mono); opacity: .7; }
  .rp-wz-pill[aria-current="true"] { color: var(--c-accent); border-bottom-color: var(--c-accent); }
  .rp-wz-pill.is-done { color: var(--c-ink); }
  .rp-wz-pill.is-done::after { content: " ✓"; color: var(--c-accent); }
  .rp-wz-pill:hover { color: var(--c-accent); }

  .rp-wz-body { padding: var(--s-4); border-top: 1px solid var(--c-line); margin-top: var(--s-3); }

  /* 世界观卡片：一张一个主题，靠序号与细线分开，不靠彩色块 */
  .rp-wz-lore { margin: 0 0 var(--s-3); padding: 0 0 var(--s-3) var(--s-3); border-left: 2px solid var(--c-line); }
  .rp-wz-lore:last-child { margin-bottom: 0; padding-bottom: 0; }
  .rp-wz-lore h3 { margin: 0 0 2px; font-family: var(--f-title); font-size: 14px; letter-spacing: .08em; color: var(--c-accent); }
  .rp-wz-lore p { margin: 0; font-size: 13px; line-height: 1.85; }

  .rp-wz-field { margin: 0 0 var(--s-3); }
  .rp-wz-label { display: block; margin: 0 0 var(--s-1); font-size: 11px; letter-spacing: .1em; color: var(--c-mid); }
  .rp-wz-label .rp-wz-req { color: var(--c-seal); }
  .rp-wz input[type="text"], .rp-wz select, .rp-wz textarea {
    width: 100%; font: inherit; font-size: 13px; line-height: 1.6;
    color: var(--c-ink); background: var(--c-paper-2);
    border: 1px solid var(--c-line); border-radius: 1px;
    padding: 7px 9px;
  }
  .rp-wz textarea { min-height: 72px; resize: vertical; }
  .rp-wz input:focus, .rp-wz select:focus, .rp-wz textarea:focus {
    outline: none; border-color: var(--c-accent); background: #fff;
    box-shadow: 0 0 0 2px rgba(47, 84, 104, .12);
  }
  .rp-wz-custom { margin-top: 6px; }

  .rp-wz-nav { display: flex; gap: var(--s-2); justify-content: space-between; padding: 0 var(--s-4) var(--s-4); }
  .rp-wz-btn {
    font: inherit; font-size: 13px; cursor: pointer; padding: 7px 16px;
    color: var(--c-ink); background: transparent;
    border: 1px solid var(--c-line); border-radius: 1px;
    transition: border-color 180ms ease, background 180ms ease, transform 180ms ease, box-shadow 180ms ease;
  }
  .rp-wz-btn:hover { border-color: var(--c-accent); }
  .rp-wz-btn:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; }
  .rp-wz-btn[disabled] { opacity: .35; cursor: default; }
  .rp-wz-btn.is-primary { color: var(--c-paper); background: var(--c-accent); border-color: var(--c-accent); box-shadow: 2px 2px 0 var(--c-line); }
  .rp-wz-btn.is-primary:active { transform: translate(2px, 2px); box-shadow: none; }

  .rp-wz-sum { font-size: 13px; }
  .rp-wz-sum h3 {
    margin: var(--s-3) 0 6px; padding-bottom: 3px; font-family: var(--f-title);
    font-size: 12px; letter-spacing: .16em; color: var(--c-accent); border-bottom: 1px solid var(--c-line);
  }
  .rp-wz-sum h3:first-child { margin-top: 0; }
  .rp-wz-sum dl { margin: 0; display: grid; grid-template-columns: minmax(5em, auto) 1fr; gap: 4px var(--s-3); }
  .rp-wz-sum dt { color: var(--c-mid); }
  .rp-wz-sum dd { margin: 0; }
  .rp-wz-out {
    margin: var(--s-3) 0 0; padding: var(--s-3); max-height: 220px; overflow: auto;
    font-family: var(--f-mono); font-size: 12px; line-height: 1.7;
    white-space: pre-wrap; word-break: break-word;
    background: var(--c-paper-2); border: 1px solid var(--c-line); border-radius: 1px;
  }
  .rp-wz-tip { margin: var(--s-2) 0 0; font-size: 12px; color: var(--c-mid); }
  .rp-wz-tip.is-warn { color: var(--c-seal); }
  .rp-wz-tip.is-ok { color: var(--c-accent); }

  /* ===== 三、预览画布 ===== */
  body.rp-preview {
    margin: 0; padding: 32px 16px 48px; background: #d9d4c8;
    background-image: radial-gradient(120% 55% at 50% 0, rgba(255, 255, 255, .6), transparent 70%);
    background-repeat: no-repeat; background-attachment: fixed;
  }
  .rp-preview-tag {
    max-width: var(--canvas-w, 700px); margin: 0 auto 8px;
    font: 11px/1 ui-monospace, Consolas, monospace; letter-spacing: .1em; color: #6b6459;
  }
  .rp-preview .rp-wz { max-width: var(--canvas-w, 700px); margin: 0 auto; }

  @media (prefers-reduced-motion: reduce) {
    .rp-wz-btn { transition: none; }
    .rp-wz-btn.is-primary:active { transform: none; }
  }
  @media (max-width: 420px) {
    .rp-wz-title { font-size: 18px; }
    .rp-wz-steps { gap: 2px; }
    .rp-wz-pill { margin-right: var(--s-2); }
  }
</style>
</head>
<body>
<div id="rp-wz-mount"></div>
<!-- 路径 B（捕获组预填）才需要：本行换成带 hidden 的 textarea，内容写捕获组占位符；同时把 findRegex 改成带捕获组的写法。见 references/frontend-conventions.md 第二节。 -->
<script>
(function () {
  'use strict';

  /* ==== 四栏声明（frontend-interaction.md 第一节）==== */
  var READS   = [{ source: 'local', path: 'localStorage 草稿', when: '打开界面' }];
  var WRITES  = [
    { scope: 'local', path: 'localStorage 草稿', when: '每次填写' },
    { scope: 'chat', path: '玩家消息', when: '提交建卡表并确认' }
  ];
  var LISTENS = [];
  var NEEDS   = ['triggerSlash'];

  /* ===== 配置：只改这几处 ===== */
  var PROJECT = '未命名项目';          // 与 contract.project.name 一致，localStorage 键前缀用它
  var TITLE = '角色创建';
  var SUBTITLE = 'CHARACTER CREATION';
  var STAMP = '档案卷宗';              // 右上角小印；不要就整行删掉
  var OUTRO = '填完点「复制档案」，把这段粘贴进聊天即可。';

  /* 每一步：kind = lore（世界观卡片）/ form（表单）/ summary（总览导出）
     form 字段：k=键名（导出用）, label=显示名, type=text|textarea|select, options=[], custom=true 允许自定义, req=true 必填, ph=占位 */
  var STEPS = [
    {
      key: '序章', title: '世界序章', kind: 'lore',
      items: [
        { h: '世界', p: '[待定：一段话讲清这是什么地方、什么时代]' },
        { h: '规则', p: '[待定：这个世界里什么能做、什么做不到、代价是什么]' },
        { h: '此刻', p: '[待定：故事从哪一刻开始]' }
      ]
    },
    {
      key: '基础身份', title: '基础身份', kind: 'form',
      fields: [
        { k: 'name', label: '角色姓名', type: 'text', req: true, ph: '你希望别人怎么称呼你' },
        { k: 'age', label: '年龄', type: 'text', ph: '数字或大致范围' },
        { k: 'gender', label: '性别', type: 'select', options: ['男', '女', '其他'], custom: true },
        { k: 'identity', label: '身份 / 职业', type: 'text', ph: '在故事里的位置' }
      ]
    },
    {
      key: '性格与信念', title: '性格与信念', kind: 'form',
      fields: [
        { k: 'personality', label: '性格要点', type: 'textarea', ph: '两三个可观察的特征，不要形容词堆砌' },
        { k: 'creed', label: '信条', type: 'text', ph: '一句你会为之破例的话' },
        { k: 'goal', label: '目标', type: 'text', ph: '你最想要什么' }
      ]
    },
    { key: '总览', title: '角色总览', kind: 'summary' }
  ];

  /* 预览守卫：楼层 iframe 里 self !== top；直接打开预览副本时 self === top。
     正式聊天里永远读真实填写与 localStorage，预览里才用 MOCK。 */
  var RP_PREVIEW = (function () {
    try { return window.self === window.top; } catch (e) { return false; }
  })();
  var MOCK = { name: '祁昭', age: '三十一', gender: '男', identity: '第七塔次席守夜人',
               personality: '话少，先看灯再看人；对潮声有生理性的厌恶。',
               creed: '灯亮着，就得有人守。', goal: '撑到下一次换班' };

  var STORE_DATA = 'rpwz:' + PROJECT + ':data';
  var STORE_STEP = 'rpwz:' + PROJECT + ':step';

  function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  var data = RP_PREVIEW ? Object.assign({}, MOCK) : (load(STORE_DATA) || {});
  var step = RP_PREVIEW ? 1 : (Number(load(STORE_STEP)) || 0);   // 预览从表单页开始，最能看出排版

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      // 实体一律用 & 拼：正文里的实体写法会被渲染管线多吃掉一层（见 frontend-conventions 三之一）
      return { '&': '\x26amp;', '<': '\x26lt;', '>': '\x26gt;', '"': '\x26quot;', "'": '\x26#39;' }[c];
    });
  }

  /* 路径 B（捕获组预填）才需要：捕获内容塞进隐藏 textarea，这里读回来预填。
     默认路径 A 无捕获组，捕获组占位符不出现在 HTML 里——加了 textarea 就要同步改 findRegex 与前端门第 4 条。 */
  function prefillFromDollar1() {
    if (RP_PREVIEW) return;
    var el = document.getElementById('rp-wz-raw');
    var raw = el ? String(el.value || '').trim() : '';
    if (!raw || raw.charAt(0) === '$') return;
    raw.split('\n').forEach(function (line) {
      var m = line.match(/\[([^|]+)\|([^\]]*)\]/);
      if (m && !data[m[1].trim()]) data[m[1].trim()] = m[2].trim();
    });
  }

  function renderSteps() {
    return STEPS.map(function (s, i) {
      var cls = 'rp-wz-pill' + (i < step ? ' is-done' : '');
      return '<button type="button" class="' + cls + '" data-n="' + (i + 1) + '" aria-current="' + (i === step) +
        '" data-step="' + i + '">' + esc(s.key) + '</button>';
    }).join('');
  }

  function renderLore(s) {
    return (s.items || []).map(function (it) {
      return '<div class="rp-wz-lore"><h3>' + esc(it.h) + '</h3><p>' + esc(it.p) + '</p></div>';
    }).join('');
  }

  function renderField(f) {
    var v = data[f.k] || '';
    var id = 'rp-wz-f-' + f.k;
    var label = '<label class="rp-wz-label" for="' + id + '">' + esc(f.label) +
      (f.req ? ' <span class="rp-wz-req">*</span>' : '') + '</label>';
    var input;
    if (f.type === 'textarea') {
      input = '<textarea id="' + id + '" data-k="' + esc(f.k) + '" placeholder="' + esc(f.ph || '') + '">' + esc(v) + '</textarea>';
    } else if (f.type === 'select') {
      var opts = (f.options || []).slice();
      var isCustom = v && opts.indexOf(v) < 0;
      if (f.custom) opts.push('__custom__');
      input = '<select id="' + id + '" data-k="' + esc(f.k) + '">' +
        '<option value="">— 未选 —</option>' +
        opts.map(function (o) {
          var sel = (isCustom ? (o === '__custom__') : (o === v)) ? ' selected' : '';
          return '<option value="' + esc(o) + '"' + sel + '>' + esc(o === '__custom__' ? '自定义…' : o) + '</option>';
        }).join('') + '</select>' +
        (f.custom ? '<input type="text" class="rp-wz-custom" id="' + id + '-custom" placeholder="自己写一个" value="' +
          esc(isCustom ? v : '') + '"' + (isCustom ? '' : ' hidden') + '>' : '');
    } else {
      input = '<input type="text" id="' + id + '" data-k="' + esc(f.k) + '" placeholder="' + esc(f.ph || '') + '" value="' + esc(v) + '">';
    }
    return '<div class="rp-wz-field">' + label + input + '</div>';
  }

  function markdown() {
    var out = '# ' + (data.name || '未命名角色') + ' — 角色档案\n\n';
    STEPS.forEach(function (s) {
      if (s.kind !== 'form') return;
      var rows = (s.fields || []).filter(function (f) {
        var v = data[f.k];
        return v && String(v).trim() && v !== '__custom__';
      });
      if (!rows.length) return;
      out += '## ' + s.key + '\n\n';
      rows.forEach(function (f) { out += '- **' + f.label + '：** ' + String(data[f.k]).trim() + '\n'; });
      out += '\n';
    });
    return out.trim() + '\n';
  }

  function renderSummary() {
    var blocks = '';
    STEPS.forEach(function (s) {
      if (s.kind !== 'form') return;
      var rows = (s.fields || []).filter(function (f) { return data[f.k] && data[f.k] !== '__custom__'; });
      if (!rows.length) return;
      blocks += '<h3>' + esc(s.key) + '</h3><dl>' + rows.map(function (f) {
        return '<dt>' + esc(f.label) + '</dt><dd>' + esc(data[f.k]) + '</dd>';
      }).join('') + '</dl>';
    });
    if (!blocks) blocks = '<p class="rp-wz-tip">还没有填任何内容。回到前面的步骤填几项。</p>';
    var missing = [];
    STEPS.forEach(function (s) {
      (s.fields || []).forEach(function (f) {
        if (f.req && (!data[f.k] || data[f.k] === '__custom__')) missing.push(f.label);
      });
    });
    var warn = missing.length
      ? '<p class="rp-wz-tip is-warn">还差必填项：' + esc(missing.join('、')) + '。留着也能导出，但下游会当作未定。</p>'
      : '';
    return '<div class="rp-wz-sum">' + warn + blocks +
      '<div class="rp-wz-out" id="rp-wz-md">' + esc(markdown()) + '</div>' +
      '<p class="rp-wz-tip" id="rp-wz-copy-tip">' + esc(OUTRO) + '</p></div>';
  }

  function render() {
    var s = STEPS[step];
    var body = s.kind === 'lore' ? renderLore(s)
      : s.kind === 'form' ? (s.fields || []).map(renderField).join('')
        : renderSummary();

    var mount = document.getElementById('rp-wz-root');
    mount.innerHTML =
      '<div class="rp-wz-head"><div><h1 class="rp-wz-title">' + esc(TITLE) + '</h1>' +
      '<p class="rp-wz-sub">' + esc(SUBTITLE) + '</p></div>' +
      (STAMP ? '<span class="rp-wz-stamp">' + esc(STAMP) + '</span>' : '') + '</div>' +
      '<div class="rp-wz-steps">' + renderSteps() + '</div>' +
      '<div class="rp-wz-body">' + body + '</div>' +
      '<div class="rp-wz-nav">' +
      '<button type="button" class="rp-wz-btn" data-nav="-1"' + (step === 0 ? ' disabled' : '') + '>← 上一步</button>' +
      (s.kind === 'summary'
        ? '<button type="button" class="rp-wz-btn is-primary" data-copy="1">复制档案</button>'
        : '<button type="button" class="rp-wz-btn is-primary" data-nav="1">下一步 →</button>') +
      '</div>';

    bind(s);
  }

  function bind(s) {
    Array.prototype.forEach.call(document.querySelectorAll('[data-step]'), function (el) {
      el.addEventListener('click', function () { collect(s); go(Number(el.getAttribute('data-step'))); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), function (el) {
      el.addEventListener('click', function () { collect(s); go(step + Number(el.getAttribute('data-nav'))); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-k]'), function (el) {
      el.addEventListener('input', function () { collect(s); });
      el.addEventListener('change', function () {
        if (el.tagName === 'SELECT' && el.value === '__custom__') {
          var c = document.getElementById(el.id + '-custom');
          if (c) { c.hidden = false; c.focus(); }
        }
        collect(s);
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-copy]'), function (el) {
      el.addEventListener('click', function () { collect(s); copy(markdown()); });
    });
  }

  function collect(s) {
    if (s.kind !== 'form') return;
    (s.fields || []).forEach(function (f) {
      var el = document.getElementById('rp-wz-f-' + f.k);
      if (!el) return;
      var v = el.value;
      if (f.type === 'select' && v === '__custom__') {
        var c = document.getElementById('rp-wz-f-' + f.k + '-custom');
        v = c ? c.value.trim() : '';
      }
      if (v) data[f.k] = v; else delete data[f.k];
    });
    if (!RP_PREVIEW) save(STORE_DATA, data);
  }

  function go(next) {
    if (next < 0) next = 0;
    if (next > STEPS.length - 1) next = STEPS.length - 1;
    step = next;
    if (!RP_PREVIEW) save(STORE_STEP, step);
    render();
  }

  function copy(text) {
    var tip = document.getElementById('rp-wz-copy-tip');
    function ok() { if (tip) { tip.textContent = '已复制，去聊天里粘贴。'; tip.classList.add('is-ok'); } }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); ok(); } catch (e) { if (tip) tip.textContent = '复制失败，请手动选中上面的文本。'; }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, fallback);
    } else { fallback(); }
  }

  function mount() {
    var host = document.getElementById('rp-wz-mount');
    var w = '';
    try { w = new URLSearchParams(location.search).get('w') || ''; } catch (e) {}
    if (RP_PREVIEW) {
      document.body.classList.add('rp-preview');
      if (w && /^\d+$/.test(w)) document.body.style.setProperty('--canvas-w', w + 'px');
      var tag = document.createElement('div');
      tag.className = 'rp-preview-tag';
      tag.textContent = '预览 ' + (w && /^\d+$/.test(w) ? w : 700) + 'px · 正式聊天里不显示这行';
      document.body.insertBefore(tag, host);
    }
    var root = document.createElement('div');
    root.className = 'rp-wz';
    root.id = 'rp-wz-root';
    host.appendChild(root);
    prefillFromDollar1();
    if (step > STEPS.length - 1) step = 0;
    render();
  }

  mount();
})();
</script>
</body>
</html>
