<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ===== 一、语义层：只改这里就能换皮肤 =====
     色值不是随便挑的：三意象（盐壳 / 灯油 / 铁栅）+ 一光源（提灯），见 references/frontend-design.md 第一节。
     --c-ink 意象最暗处  --c-mid 意象本体  --c-paper 环境底  --c-accent 光源  */
  :root {
    --c-ink: #1c1a17;
    --c-mid: #6b6459;
    --c-paper: #efe9dc;
    --c-line: #cfc7b5;
    --c-accent: #b8862b;
    --c-warn: #c07a1e;
    --c-danger: #a4332a;
    --f-title: "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", "SimSun", serif;
    --f-body: "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    --f-num: ui-monospace, "SF Mono", Consolas, "Roboto Mono", monospace;
    --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px;
  }

  /* ===== 二、组件层：用语义变量拼装，不写字面色值 ===== */
  .rp-sb {
    --rp-sb-bar-h: 9px;
    box-sizing: border-box;
    font-family: var(--f-body);
    font-size: 14px;
    line-height: 1.6;
    color: var(--c-ink);
    background: var(--c-paper);
    background-image: repeating-linear-gradient(0deg, rgba(28, 26, 23, .022) 0 1px, transparent 1px 3px);
    border: 1px solid var(--c-line);
    border-top: 3px double var(--c-ink);
    box-shadow: 2px 2px 0 var(--c-line);
    padding: var(--s-3) var(--s-4) var(--s-4);
    max-width: 100%;
    border-radius: 2px;
  }
  .rp-sb * { box-sizing: border-box; }

  /* 抬头：小字刊期，字距拉开；中文小字不加字距会糊 */
  .rp-sb-meta {
    display: flex; flex-wrap: wrap; gap: var(--s-1) var(--s-3);
    margin: 0 0 var(--s-3); padding: 0 0 var(--s-2);
    border-bottom: 1px solid var(--c-line);
    color: var(--c-mid);
    font-size: 11px; letter-spacing: .08em;
  }
  .rp-sb-meta span { white-space: nowrap; }
  .rp-sb-meta span + span::before { content: "·"; margin-right: var(--s-3); opacity: .5; }

  .rp-sb-rows { display: grid; gap: 10px; }
  .rp-sb-row {
    display: grid;
    grid-template-columns: 5.5em 1fr auto;
    align-items: center;
    gap: var(--s-2);
  }
  .rp-sb-name { font-size: 12px; letter-spacing: .06em; color: var(--c-mid); }

  /* 条：刻度用重复渐变画，不用额外元素；边角硬，和纸面一致 */
  .rp-sb-bar {
    position: relative; height: var(--rp-sb-bar-h);
    background: rgba(28, 26, 23, .09);
    background-image: repeating-linear-gradient(90deg, transparent 0 calc(25% - 1px), var(--c-paper) calc(25% - 1px) 25%);
    border: 1px solid var(--c-line);
    overflow: hidden;
  }
  .rp-sb-fill {
    display: block; height: 100%; width: 0;
    background: var(--c-accent);
    transition: width 320ms cubic-bezier(.25, .46, .45, .94);
  }
  .rp-sb-val {
    font-family: var(--f-num); font-variant-numeric: tabular-nums;
    font-size: 12px; min-width: 4.5em; text-align: right; color: var(--c-ink);
  }
  .rp-sb-delta { font-size: 11px; margin-left: var(--s-1); color: var(--c-mid); }

  .rp-sb-row.is-warn .rp-sb-fill { background: var(--c-warn); }
  .rp-sb-row.is-danger .rp-sb-fill { background: var(--c-danger); }
  .rp-sb-row.is-danger .rp-sb-val { color: var(--c-danger); font-weight: 600; }
  .rp-sb-row.is-danger .rp-sb-name::after { content: " ▮"; color: var(--c-danger); }
  .rp-sb-row.is-danger .rp-sb-bar { animation: rp-sb-pulse 2.4s ease-in-out infinite; }
  @keyframes rp-sb-pulse { 0%, 100% { opacity: 1 } 50% { opacity: .58 } }

  .rp-sb-empty { color: var(--c-mid); font-size: 12px; letter-spacing: .06em; }

  /* ===== 三、预览画布（只在本机预览副本里生效）===== */
  body.rp-preview {
    margin: 0; padding: 32px 16px 48px;
    background: #d9d4c8;
    background-image: radial-gradient(120% 55% at 50% 0, rgba(255, 255, 255, .55), transparent 70%);
    background-repeat: no-repeat; background-attachment: fixed;
  }
  .rp-preview-tag {
    max-width: var(--canvas-w, 700px); margin: 0 auto 8px;
    font: 11px/1 ui-monospace, Consolas, monospace; letter-spacing: .1em;
    color: #6b6459;
  }
  .rp-preview .rp-sb { max-width: var(--canvas-w, 700px); margin: 0 auto; }

  /* 动效只有两处：数值过渡 + 危险呼吸；其余一律不动 */
  @media (prefers-reduced-motion: reduce) {
    .rp-sb-fill { transition: none; }
    .rp-sb-row.is-danger .rp-sb-bar { animation: none; }
  }
  @media (max-width: 420px) {
    .rp-sb-row { grid-template-columns: 4.5em 1fr auto; gap: 6px; }
    .rp-sb-name { font-size: 11px; }
  }
</style>
</head>
<body>
<div id="rp-sb-mount"></div>
<textarea id="rp-sb-raw" hidden>$1</textarea>
<script>
(function () {
  'use strict';

  /* ==== 四栏声明（frontend-interaction.md 第一节）：只读就写 WRITES = [] ==== */
  var READS   = [{ source: 'mvux', path: 'stat_data.<轴名>', when: '每轮渲染' }];
  var WRITES  = [];                     // 状态栏只读；要改数据另做控制中心（templates/control-center.html）
  var LISTENS = ['CHARACTER_MESSAGE_RENDERED', 'MESSAGE_SWIPED', 'MESSAGE_EDITED', 'CHAT_CHANGED'];
  var NEEDS   = ['getChatMessages', 'getCurrentMessageId', 'eventOn'];

  /* ===== 配置：三处一致性靠这里 ===== */
  var TAG = '状态栏';                 // 与正则 findRegex、frontend-prompt.yaml 的 标签 逐字一致
  var FOLLOW_LATEST = false;          // false=读本楼（每楼快照）；true=永远读最新楼
  var HIDE_UNKNOWN = true;            // 值为 未知 时整条隐去；false 则显示空条 + 未知

  /* kind: 'text' 进抬头信息条；'bar' 进数值行
     dir:  'up' 值越高越好；'down' 值越高越危险；'none' 不上色
     warn / danger: 危险区起点，不给就不上色
     min / max: 抄 axis-system.yaml 对应轴的 range */
  var FIELDS = [
    { name: '时间', kind: 'text' },
    { name: '地点', kind: 'text' },
    { name: '灯芯', kind: 'bar', min: 0, max: 100, dir: 'down', warn: 40, danger: 15, unit: '' },
    { name: '潮压', kind: 'bar', min: 0, max: 1, dir: 'down', warn: 0.6, danger: 0.85, unit: '', decimals: 2 }
  ];

  /* 预览守卫：在酒馆楼层的 iframe 里 self !== top；直接双击打开预览副本时 self === top。
     正式聊天里永远走真实数据，预览副本里才用 MOCK。 */
  var RP_PREVIEW = (function () {
    try { return window.self === window.top; } catch (e) { return false; }
  })();
  var MOCK = '<状态栏>\n<时间>潮历四十七年 · 第三次涨潮 · 夜</时间>\n<地点>第七塔 · 塔顶灯室</地点>\n<灯芯>18</灯芯>\n<潮压>0.87</潮压>\n</状态栏>';

  var NUM_RE = /^-?\d+(?:\.\d+)?$/;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      // 实体一律用 & 拼：正文里的实体写法会被渲染管线多吃掉一层（见 frontend-conventions 三之一）
      return { '&': '\x26amp;', '<': '\x26lt;', '>': '\x26gt;', '"': '\x26quot;', "'": '\x26#39;' }[c];
    });
  }

  function pick(block, name) {
    var m = block.match(new RegExp('<' + name + '>([\\s\\S]*?)<\\/' + name + '>'));
    return m ? m[1].trim() : '';
  }

  function parse(text) {
    var m = String(text || '').match(new RegExp('<' + TAG + '>([\\s\\S]*?)<\\/' + TAG + '>'));
    if (!m) return null;
    var out = {};
    FIELDS.forEach(function (f) { out[f.name] = pick(m[1], f.name); });
    return out;
  }

  function rawFromDollar1() {
    var el = document.getElementById('rp-sb-raw');
    var v = el ? String(el.value || '').trim() : '';
    if (!v || v.indexOf('$1') === 0) return '';
    return v;
  }

  function messageText() {
    if (RP_PREVIEW) return MOCK;
    var injected = rawFromDollar1();
    if (injected) return '<' + TAG + '>' + injected + '</' + TAG + '>';
    try {
      var list = getChatMessages(FOLLOW_LATEST ? -1 : getCurrentMessageId());
      return list && list.length ? list[0].message : '';
    } catch (e) { return ''; }
  }

  function previousData() {
    if (RP_PREVIEW || rawFromDollar1() || FOLLOW_LATEST) return null;
    try {
      var id = getCurrentMessageId();
      if (id <= 0) return null;
      var prev = getChatMessages(id - 1);
      return prev && prev.length ? parse(prev[0].message) : null;
    } catch (e) { return null; }
  }

  function fmt(n, f) {
    var d = f.decimals == null ? (Math.abs(n) >= 10 || n % 1 === 0 ? 0 : 1) : f.decimals;
    return n.toFixed(d) + (f.unit || '');
  }

  function zone(f, v) {
    if (f.dir === 'none' || f.warn == null) return '';
    if (f.dir === 'down') {
      if (f.danger != null && v <= f.danger) return ' is-danger';
      if (v <= f.warn) return ' is-warn';
      return '';
    }
    if (f.danger != null && v >= f.danger) return ' is-danger';
    if (v >= f.warn) return ' is-warn';
    return '';
  }

  function deltaHtml(f, v, prev) {
    if (!prev || prev[f.name] == null || !NUM_RE.test(prev[f.name])) return '';
    var d = v - parseFloat(prev[f.name]);
    if (Math.abs(d) < 1e-9) return '';        // 没变化就不显示 ↑0
    return '<span class="rp-sb-delta">' + (d > 0 ? '↑' : '↓') + esc(fmt(Math.abs(d), f)) + '</span>';
  }

  function rowHtml(f, zoneCls, pct, valHtml) {
    return '<div class="rp-sb-row' + zoneCls + '">' +
      '<span class="rp-sb-name">' + esc(f.name) + '</span>' +
      '<div class="rp-sb-bar" role="progressbar" aria-label="' + esc(f.name) +
      '" aria-valuemin="' + f.min + '" aria-valuemax="' + f.max + '">' +
      '<span class="rp-sb-fill" style="width:' + pct + '%"></span></div>' +
      '<span class="rp-sb-val">' + valHtml + '</span></div>';
  }

  function render() {
    var root = document.getElementById('rp-sb-root');
    var data = parse(messageText());
    if (!data) {
      if (root) root.innerHTML = '';
      return;
    }

    var prev = previousData();
    var meta = [];
    var rows = [];

    FIELDS.forEach(function (f) {
      var raw = data[f.name];
      if (f.kind === 'text') {
        if (raw) meta.push('<span>' + esc(raw) + '</span>');
        return;
      }
      var known = raw !== '' && NUM_RE.test(raw);
      if (!known) {
        if (HIDE_UNKNOWN) return;                        // 缺值：整条隐去，不留空槽
        rows.push(rowHtml(f, '', 0, esc(raw || '未知'))); // 畸形值：原样显示，便于发现模型漂移
        return;
      }
      var v = parseFloat(raw);
      var span = (f.max - f.min) || 1;
      var pct = Math.max(0, Math.min(100, ((v - f.min) / span) * 100)).toFixed(1);
      rows.push(rowHtml(f, zone(f, v), pct, esc(fmt(v, f)) + deltaHtml(f, v, prev)));
    });

    var html = (meta.length ? '<div class="rp-sb-meta">' + meta.join('') + '</div>' : '') +
      (rows.length ? '<div class="rp-sb-rows">' + rows.join('') + '</div>'
                   : '<div class="rp-sb-empty">本楼无可用数值</div>');
    if (root) root.innerHTML = html;
  }

  /* ---- 挂载：预览时插画布标签；正式环境只插本体 ---- */
  function mount() {
    var mount = document.getElementById('rp-sb-mount');
    var w = '';
    try { w = new URLSearchParams(location.search).get('w') || ''; } catch (e) {}
    if (RP_PREVIEW) {
      document.body.classList.add('rp-preview');
      if (w) document.body.style.setProperty('--canvas-w', /^\d+$/.test(w) ? w + 'px' : '');
      var tag = document.createElement('div');
      tag.className = 'rp-preview-tag';
      tag.textContent = '预览 ' + (w && /^\d+$/.test(w) ? w : 700) + 'px · 正式聊天里不显示这行';
      document.body.insertBefore(tag, mount);
    }
    var root = document.createElement('div');
    root.className = 'rp-sb';
    root.id = 'rp-sb-root';
    mount.appendChild(root);
    render();
  }

  mount();

  if (!RP_PREVIEW && typeof eventOn === 'function' && typeof tavern_events !== 'undefined') {
    eventOn(tavern_events.CHARACTER_MESSAGE_RENDERED, render);
    eventOn(tavern_events.USER_MESSAGE_RENDERED, render);
    if (tavern_events.MESSAGE_SWIPED) eventOn(tavern_events.MESSAGE_SWIPED, render);
    if (tavern_events.MESSAGE_UPDATED) eventOn(tavern_events.MESSAGE_UPDATED, render);
  }
  window.addEventListener('pagehide', function () {
    if (typeof eventClearAll === 'function') eventClearAll();
  });
})();
</script>
</body>
</html>
