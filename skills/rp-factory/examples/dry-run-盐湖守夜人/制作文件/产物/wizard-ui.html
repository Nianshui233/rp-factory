<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* 语义层：三意象（盐壳 / 灯油 / 铁栅）+ 一光源（提灯）。换世界只改这里。*/
  :root {
    --c-ink: #12100e;
    --c-surface: #1a1714;
    --c-fg: #e6e0d4;
    --c-mid: #938b7d;
    --c-line: #322c25;
    --c-accent: #d8a13c;
    --c-danger: #b5442f;
    --f-title: "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", "SimSun", serif;
    --f-body: "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --f-mono: ui-monospace, "SF Mono", Consolas, "Roboto Mono", monospace;
  }
  /* 组件层：只吃语义变量 */
  .rp-wz {
    box-sizing: border-box;
    font-family: var(--f-body);
    font-size: 14px; line-height: 1.7;
    color: var(--c-fg);
    background: var(--c-ink);
    background-image: repeating-linear-gradient(0deg, rgba(255, 255, 255, .014) 0 1px, transparent 1px 4px);
    border: 1px solid var(--c-line);
    border-top: 3px double var(--c-mid);
    border-radius: 2px;
    max-width: 100%;
    overflow: hidden;
  }
  .rp-wz * { box-sizing: border-box; }
  .rp-wz-head { padding: 18px 18px 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .rp-wz-title { margin: 0; font-family: var(--f-title); font-size: 21px; letter-spacing: .1em; }
  .rp-wz-sub { margin: 4px 0 0; font-size: 10px; color: var(--c-mid); letter-spacing: .26em; }
  .rp-wz-stamp { flex: none; padding: 2px 7px; font-family: var(--f-title); font-size: 11px; letter-spacing: .18em; color: var(--c-accent); border: 1px solid var(--c-accent); border-radius: 1px; }
  .rp-wz-steps { display: flex; align-items: center; gap: 0; padding: 16px 18px 0; flex-wrap: wrap; }
  .rp-wz-pill {
    font: inherit; font-size: 11px; letter-spacing: .06em; cursor: pointer;
    padding: 3px 2px; margin-right: 12px; border-radius: 0;
    color: var(--c-mid); background: none; border: 0; border-bottom: 1px solid transparent;
  }
  .rp-wz-pill::before { content: attr(data-n) ". "; font-family: var(--f-mono); opacity: .7; }
  .rp-wz-pill[aria-current="true"] { color: var(--c-accent); border-bottom-color: var(--c-accent); }
  .rp-wz-pill.is-done { color: var(--c-fg); }
  .rp-wz-pill.is-done::after { content: " ✓"; color: var(--c-accent); }
  .rp-wz-body { padding: 16px 18px; border-top: 1px solid var(--c-line); margin-top: 12px; }
  .rp-wz-lore { border-left: 2px solid var(--c-line); padding: 0 0 12px 12px; margin: 0 0 12px; }
  .rp-wz-lore:last-child { margin-bottom: 0; padding-bottom: 0; }
  .rp-wz-lore h3 { margin: 0 0 2px; font-family: var(--f-title); font-size: 14px; letter-spacing: .08em; color: var(--c-accent); }
  .rp-wz-lore p { margin: 0; font-size: 13px; line-height: 1.85; color: var(--c-fg); }
  .rp-wz-field { margin: 0 0 14px; }
  .rp-wz-label { display: block; margin: 0 0 4px; font-size: 11px; color: var(--c-mid); letter-spacing: .1em; }
  .rp-wz-label .rp-wz-req { color: var(--c-danger); }
  .rp-wz input[type="text"], .rp-wz select, .rp-wz textarea {
    width: 100%; font: inherit; font-size: 13px; line-height: 1.6;
    color: var(--c-fg); background: var(--c-surface);
    border: 1px solid var(--c-line); border-radius: 1px;
    padding: 7px 9px;
  }
  .rp-wz textarea { min-height: 72px; resize: vertical; }
  .rp-wz input:focus, .rp-wz select:focus, .rp-wz textarea:focus {
    outline: none; border-color: var(--c-accent); box-shadow: 0 0 0 2px rgba(216, 161, 60, .14);
  }
  .rp-wz-custom { margin-top: 6px; }
  .rp-wz-nav { display: flex; gap: 8px; justify-content: space-between; padding: 0 18px 18px; }
  .rp-wz-btn {
    font: inherit; font-size: 13px; cursor: pointer;
    padding: 7px 16px; border-radius: 1px;
    color: var(--c-fg); background: transparent;
    border: 1px solid var(--c-line);
    transition: border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
  }
  .rp-wz-btn:hover { border-color: var(--c-accent); }
  .rp-wz-btn:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; }
  .rp-wz-btn[disabled] { opacity: .35; cursor: default; }
  .rp-wz-btn.is-primary { color: var(--c-ink); background: var(--c-accent); border-color: var(--c-accent); box-shadow: 2px 2px 0 var(--c-line); }
  .rp-wz-btn.is-primary:active { transform: translate(2px, 2px); box-shadow: none; }
  .rp-wz-sum { font-size: 13px; }
  .rp-wz-sum h3 { margin: 12px 0 6px; padding-bottom: 3px; font-family: var(--f-title); font-size: 12px; letter-spacing: .16em; color: var(--c-accent); border-bottom: 1px solid var(--c-line); }
  .rp-wz-sum h3:first-child { margin-top: 0; }
  .rp-wz-sum dl { margin: 0; display: grid; grid-template-columns: minmax(5em, auto) 1fr; gap: 4px 12px; }
  .rp-wz-sum dt { color: var(--c-mid); }
  .rp-wz-sum dd { margin: 0; }
  .rp-wz-out {
    margin: 12px 0 0; padding: 12px; max-height: 220px; overflow: auto;
    font-family: var(--f-mono); font-size: 12px; line-height: 1.7;
    white-space: pre-wrap; word-break: break-word;
    background: var(--c-surface); border: 1px solid var(--c-line); border-radius: 1px;
  }
  .rp-wz-tip { margin: 8px 0 0; font-size: 12px; color: var(--c-mid); }
  .rp-wz-tip.is-warn { color: var(--c-danger); }
  .rp-wz-tip.is-ok { color: var(--c-accent); }
  /* 预览画布 */
  body.rp-preview { margin: 0; padding: 32px 16px 48px; background: #0d0b0a;
    background-image: radial-gradient(120% 55% at 50% 0, rgba(216, 161, 60, .14), transparent 70%);
    background-repeat: no-repeat; background-attachment: fixed; }
  .rp-preview-tag { max-width: var(--canvas-w, 700px); margin: 0 auto 8px; font: 11px/1 ui-monospace, Consolas, monospace; letter-spacing: .1em; color: #6f665c; }
  .rp-preview .rp-wz { max-width: var(--canvas-w, 700px); margin: 0 auto; }
  @media (prefers-reduced-motion: reduce) {
    .rp-wz-btn { transition: none; }
    .rp-wz-btn.is-primary:active { transform: none; }
  }
  @media (max-width: 420px) {
    .rp-wz-title { font-size: 18px; }
    .rp-wz-pill { margin-right: 8px; }
  }
</style>
</head>
<body>
<div class="rp-wz" id="rp-wz-root"></div>
<!-- 路径 B（捕获组预填）才需要：本行换成带 hidden 的 textarea，内容写捕获组占位符；同时把 findRegex 改成带捕获组的写法。见 references/frontend-conventions.md 第二节。 -->
<script>
(function () {
  'use strict';

  /* ==== 四栏声明（frontend-interaction.md 第一节）==== */
  var READS   = [{ source: 'local', path: 'localStorage 草稿', when: '打开界面' }];
  var WRITES  = [{ scope: 'local', path: 'localStorage 草稿', when: '每次填写' },
                 { scope: 'chat', path: '玩家消息', when: '提交建卡表并确认' }];
  var LISTENS = [];
  var NEEDS   = ['triggerSlash'];

  /* ===== 配置：只改这几处 ===== */
  var PROJECT = '盐湖守夜人';
  var TITLE = '白潮';
  var SUBTITLE = 'SALT-TIDE OATH';
  var OUTRO = '填完点「复制档案」，把这段粘贴进聊天，让 AI 按它建卡。';

  var STEPS = [
    {
      key: '序章', title: '潮水与灯', kind: 'lore',
      items: [
        { h: '白潮', p: '咸水海每年向内陆推进一寸，退潮后留下薄薄一层盐壳。城退走了，只剩下靠盐活命的人。' },
        { h: '灯芯', p: '燃"盐晶灯"的光能压住潮气里的东西。灯芯烧得越快，人活得越久；烧到灯灭，人就跟着灭了。' },
        { h: '三个势力', p: '守夜所守塔与灯，拾盐人公行收盐走船，湖心教团说潮是神的呼吸，劝人别点灯。' },
        { h: '盐潮', p: '每次涨潮都会带上来些不该在陆上走的东西。守夜所管这个，也只能管这个。' },
        { h: '第七塔', p: '白潮镇最后一盏还没灭的灯，祁昭是这把灯的次席守夜人，也是最后一个还按时添油的人。' },
        { h: '此刻', p: '第三次涨潮前夜。潮声比往年近了半里，塔里的盐晶只够撑三天。' }
      ]
    },
    {
      key: '基础身份', title: '基础身份', kind: 'form',
      fields: [
        { k: 'name', label: '姓名', type: 'text', req: true, ph: '盐镇上的人怎么叫你' },
        { k: 'age', label: '年龄', type: 'text', ph: '数字或大致范围' },
        { k: 'gender', label: '性别', type: 'select', options: ['男', '女', '其他'], custom: true },
        { k: 'origin', label: '出身', type: 'select', options: ['盐镇本地', '拾盐人船队', '内陆逃难来的', '教团弃子'], custom: true },
        { k: 'lamp_oil', label: '随身灯油（天）', type: 'text', ph: '0 到 7，整数', req: true }
      ]
    },
    {
      key: '势力归属', title: '你站在谁那边', kind: 'form',
      fields: [
        { k: 'faction', label: '归属', type: 'select', options: ['守夜所', '拾盐人公行', '湖心教团', '不属任何一方'], custom: true, req: true },
        { k: 'rank', label: '职级 / 位置', type: 'select', options: ['学徒', '哨丁', '次席', '首席', '跑船的', '念祷词的'], custom: true },
        { k: 'relation', label: '与上头的关系', type: 'textarea', ph: '一两句：谁能管你、你听谁、为什么' }
      ]
    },
    {
      key: '心理', title: '想要什么，怕什么', kind: 'form',
      fields: [
        { k: 'goal', label: '目标', type: 'textarea', req: true, ph: '你最想要、愿意为它添油到天亮的东西' },
        { k: 'fear', label: '恐惧', type: 'textarea', ph: '什么情形会让你停手' },
        { k: 'values', label: '价值排序', type: 'text', ph: '活的 > 守誓 > 盐价（用 > 连起来）' },
        { k: 'conflict', label: '内在矛盾', type: 'textarea', ph: '两条你都在乎、但迟早要选一边的东西' }
      ]
    },
    {
      key: '关系与语言', title: '怎么跟人说话', kind: 'form',
      fields: [
        { k: 'close', label: '对亲近者', type: 'select', options: ['温和但话少', '嘴上不客气，事上不含糊', '直来直去'], custom: true },
        { k: 'stranger', label: '对陌生人', type: 'select', options: ['客气但隔着一层', '先打量再开口', '公事公办'], custom: true },
        { k: 'speech', label: '说话语感', type: 'select', options: ['短句，夹盐工黑话', '守夜所的官腔', '教团的祷词腔'], custom: true },
        { k: 'habit', label: '口头禅 / 小动作', type: 'text', ph: '一句或一个动作' }
      ]
    },
    {
      key: '装备与外观', title: '身上带着什么', kind: 'form',
      fields: [
        { k: 'gear', label: '随身物', type: 'textarea', ph: '三到五样，写清每样为什么带' },
        { k: 'look', label: '外貌', type: 'textarea', ph: '两三个能被看见的细节，不要形容词堆砌' },
        { k: 'mark', label: '伤疤 / 记号', type: 'text', ph: '来源一句' }
      ]
    },
    {
      key: '补充', title: '底线与去向', kind: 'form',
      fields: [
        { k: 'taboo', label: '绝不会做的事', type: 'textarea', ph: '具体可观察的行为，一条起' },
        { k: 'growth', label: '可能走向', type: 'textarea', ph: '什么事件会让你改变立场' },
        { k: 'extra', label: '其他补充', type: 'textarea', ph: '想加什么都可以' }
      ]
    },
    {
      key: '总览', title: '角色总览', kind: 'summary'
    }
  ];

  var ROOT = document.getElementById('rp-wz-root');
  var STORE_DATA = 'rpwz:' + PROJECT + ':data';
  var STORE_STEP = 'rpwz:' + PROJECT + ':step';

  /* 预览守卫：楼层 iframe 里 self !== top；直接打开预览副本时 self === top */
  var RP_PREVIEW = (function () {
    try { return window.self === window.top; } catch (e) { return false; }
  })();
  var MOCK = { name: '祁昭', age: '三十一', gender: '男', identity: '第七塔次席守夜人' };

  var data = RP_PREVIEW ? Object.assign({}, MOCK) : (load(STORE_DATA) || {});
  var step = RP_PREVIEW ? 1 : (Number(load(STORE_STEP)) || 0);

  function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function esc(s) {
    // 实体一律用 \x26 拼：正文里的实体写法会被渲染管线多吃掉一层（见 frontend-conventions 三之一）
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '\x26amp;', '<': '\x26lt;', '>': '\x26gt;', '"': '\x26quot;', "'": '\x26#39;' }[c];
    });
  }

  /* 路径 B（捕获组预填）才需要：捕获内容塞进隐藏 textarea，这里读回来预填。
     默认路径 A 无捕获组，捕获组占位符不出现在 HTML 里——加了 textarea 就要同步改 findRegex 与前端门第 4 条。 */
  function prefillFromDollar1() {
    var el = document.getElementById('rp-wz-raw');
    var raw = el ? String(el.value || '').trim() : '';
    if (!raw || raw.charAt(0) === '$') return;
    raw.split('\n').forEach(function (line) {
      var m = line.match(/\[([^|]+)\|([^\]]*)\]/);
      if (m && !data[m[1].trim()]) data[m[1].trim()] = m[2].trim();
    });
  }

  function renderSteps() {
    return STEPS.map(function (s, i) {
      var cls = 'rp-wz-pill' + (i < step ? ' is-done' : '');
      return '<button type="button" class="' + cls + '" data-n="' + (i + 1) + '" aria-current="' + (i === step) +
        '" data-step="' + i + '">' + esc(s.key) + '</button>';
    }).join('');
  }

  function renderLore(s) {
    return (s.items || []).map(function (it) {
      return '<div class="rp-wz-lore"><h3>' + esc(it.h) + '</h3><p>' + esc(it.p) + '</p></div>';
    }).join('');
  }

  function renderField(f) {
    var v = data[f.k] || '';
    var id = 'rp-wz-f-' + f.k;
    var label = '<label class="rp-wz-label" for="' + id + '">' + esc(f.label) +
      (f.req ? ' <span class="rp-wz-req">*</span>' : '') + '</label>';
    var input;
    if (f.type === 'textarea') {
      input = '<textarea id="' + id + '" data-k="' + esc(f.k) + '" placeholder="' + esc(f.ph || '') + '">' + esc(v) + '</textarea>';
    } else if (f.type === 'select') {
      var opts = (f.options || []).slice();
      var isCustom = v && opts.indexOf(v) < 0;
      if (f.custom) opts.push('__custom__');
      input = '<select id="' + id + '" data-k="' + esc(f.k) + '">' +
        '<option value="">— 未选 —</option>' +
        opts.map(function (o) {
          var val = o === '__custom__' ? '__custom__' : o;
          var text = o === '__custom__' ? '自定义…' : o;
          var sel = (isCustom ? (o === '__custom__') : (o === v)) ? ' selected' : '';
          return '<option value="' + esc(val) + '"' + sel + '>' + esc(text) + '</option>';
        }).join('') + '</select>' +
        (f.custom ? '<input type="text" class="rp-wz-custom" id="' + id + '-custom" placeholder="自己写一个" value="' +
          esc(isCustom ? v : '') + '"' + (isCustom ? '' : ' hidden') + '>' : '');
    } else {
      input = '<input type="text" id="' + id + '" data-k="' + esc(f.k) + '" placeholder="' + esc(f.ph || '') + '" value="' + esc(v) + '">';
    }
    return '<div class="rp-wz-field">' + label + input + '</div>';
  }

  function markdown() {
    var out = '# ' + (data.name || '未命名角色') + ' — 角色档案\n\n';
    STEPS.forEach(function (s) {
      if (s.kind !== 'form') return;
      var rows = (s.fields || []).filter(function (f) {
        var v = data[f.k];
        return v && String(v).trim() && v !== '__custom__';
      });
      if (!rows.length) return;
      out += '## ' + s.key + '\n\n';
      rows.forEach(function (f) { out += '- **' + f.label + '：** ' + String(data[f.k]).trim() + '\n'; });
      out += '\n';
    });
    return out.trim() + '\n';
  }

  function renderSummary() {
    var blocks = '';
    STEPS.forEach(function (s) {
      if (s.kind !== 'form') return;
      var rows = (s.fields || []).filter(function (f) { return data[f.k] && data[f.k] !== '__custom__'; });
      if (!rows.length) return;
      blocks += '<h3>' + esc(s.key) + '</h3><dl>' + rows.map(function (f) {
        return '<dt>' + esc(f.label) + '</dt><dd>' + esc(data[f.k]) + '</dd>';
      }).join('') + '</dl>';
    });
    if (!blocks) blocks = '<p class="rp-wz-tip">还没有填任何内容。回到前面的步骤填几项。</p>';
    var missing = [];
    STEPS.forEach(function (s) {
      (s.fields || []).forEach(function (f) {
        if (f.req && (!data[f.k] || data[f.k] === '__custom__')) missing.push(f.label);
      });
    });
    var warn = missing.length
      ? '<p class="rp-wz-tip">还差必填项：' + esc(missing.join('、')) + '。留着也能导出，但下游会当作未定。</p>'
      : '';
    return '<div class="rp-wz-sum">' + warn + blocks +
      '<div class="rp-wz-out" id="rp-wz-md">' + esc(markdown()) + '</div>' +
      '<p class="rp-wz-tip" id="rp-wz-copy-tip">' + esc(OUTRO) + '</p></div>';
  }

  function render() {
    var s = STEPS[step];
    var body = s.kind === 'lore' ? renderLore(s)
      : s.kind === 'form' ? (s.fields || []).map(renderField).join('')
        : renderSummary();

    ROOT.innerHTML =
      '<div class="rp-wz-head"><h1 class="rp-wz-title">' + esc(TITLE) + '</h1>' +
      '<p class="rp-wz-sub">' + esc(SUBTITLE) + '</p></div>' +
      '<div class="rp-wz-steps">' + renderSteps() + '</div>' +
      '<div class="rp-wz-body">' + body + '</div>' +
      '<div class="rp-wz-nav">' +
      '<button type="button" class="rp-wz-btn" data-nav="-1"' + (step === 0 ? ' disabled' : '') + '>← 上一步</button>' +
      (s.kind === 'summary'
        ? '<button type="button" class="rp-wz-btn is-primary" data-copy="1">复制档案</button>'
        : '<button type="button" class="rp-wz-btn is-primary" data-nav="1">下一步 →</button>') +
      '</div>';

    bind(s);
  }

  function bind(s) {
    Array.prototype.forEach.call(ROOT.querySelectorAll('[data-step]'), function (el) {
      el.addEventListener('click', function () { collect(s); go(Number(el.dataset.step)); });
    });
    Array.prototype.forEach.call(ROOT.querySelectorAll('[data-nav]'), function (el) {
      el.addEventListener('click', function () { collect(s); go(step + Number(el.dataset.nav)); });
    });
    Array.prototype.forEach.call(ROOT.querySelectorAll('[data-k]'), function (el) {
      el.addEventListener('input', function () { collect(s); });
      el.addEventListener('change', function () {
        if (el.tagName === 'SELECT' && el.value === '__custom__') {
          var c = document.getElementById(el.id + '-custom');
          if (c) { c.hidden = false; c.focus(); }
        }
        collect(s);
      });
    });
    Array.prototype.forEach.call(ROOT.querySelectorAll('[data-copy]'), function (el) {
      el.addEventListener('click', function () { collect(s); copy(markdown()); });
    });
  }

  function collect(s) {
    if (s.kind !== 'form') return;
    (s.fields || []).forEach(function (f) {
      var el = document.getElementById('rp-wz-f-' + f.k);
      if (!el) return;
      var v = el.value;
      if (f.type === 'select' && v === '__custom__') {
        var c = document.getElementById('rp-wz-f-' + f.k + '-custom');
        v = c ? c.value.trim() : '';
      }
      if (v) data[f.k] = v; else delete data[f.k];
    });
    if (!RP_PREVIEW) save(STORE_DATA, data);
  }

  function go(next) {
    if (next < 0) next = 0;
    if (next > STEPS.length - 1) next = STEPS.length - 1;
    step = next;
    if (!RP_PREVIEW) save(STORE_STEP, step);
    render();
  }

  function copy(text) {
    var tip = document.getElementById('rp-wz-copy-tip');
    function ok() { if (tip) { tip.textContent = '已复制，去聊天里粘贴。'; tip.classList.add('is-ok'); } }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); ok(); } catch (e) { if (tip) tip.textContent = '复制失败，请手动选中上面的文本。'; }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, fallback);
    } else { fallback(); }
  }

  if (RP_PREVIEW) {
    document.body.classList.add('rp-preview');
    var w = '';
    try { w = new URLSearchParams(location.search).get('w') || ''; } catch (e) {}
    if (w && /^\d+$/.test(w)) document.body.style.setProperty('--canvas-w', w + 'px');
    var tag = document.createElement('div');
    tag.className = 'rp-preview-tag';
    tag.textContent = '预览 ' + (w && /^\d+$/.test(w) ? w : 700) + 'px · 正式聊天里不显示这行';
    document.body.insertBefore(tag, ROOT);
  } else {
    prefillFromDollar1();
  }
  if (step > STEPS.length - 1) step = 0;
  render();
})();
</script>
</body>
</html>
