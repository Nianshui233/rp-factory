<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* 语义层：三意象（盐壳 / 灯油 / 铁栅）+ 一光源（提灯）。换世界只改这里。*/
  :root {
    --c-ink: #0b0f11;
    --c-surface: #12171a;
    --c-mid: #8b9698;
    --c-line: #2b3438;
    --c-accent: #d9b26a;
    --c-warn: #c8912f;
    --c-danger: #b5442f;
    --f-body: "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --f-num: ui-monospace, "SF Mono", Consolas, "Roboto Mono", monospace;
  }
  /* 组件层：只吃语义变量 */
  .rp-sb {
    --rp-sb-bar-h: 9px;
    box-sizing: border-box;
    font-family: var(--f-body);
    font-size: 14px;
    line-height: 1.6;
    color: #dfe3df;
    background: var(--c-surface);
    background-image: repeating-linear-gradient(0deg, rgba(255, 255, 255, .018) 0 1px, transparent 1px 3px);
    border: 1px solid var(--c-line);
    border-top: 3px double var(--c-mid);
    border-radius: 2px;
    padding: 12px 16px 14px;
    max-width: 100%;
    overflow: hidden;
  }
  .rp-sb * { box-sizing: border-box; }
  .rp-sb-meta {
    display: flex; flex-wrap: wrap; gap: 4px 12px;
    margin: 0 0 12px; padding: 0 0 8px;
    border-bottom: 1px solid var(--c-line);
    color: var(--c-mid); font-size: 11px; letter-spacing: .08em;
  }
  .rp-sb-meta span { white-space: nowrap; }
  .rp-sb-meta span + span::before { content: "·"; margin-right: 12px; opacity: .5; }
  .rp-sb-rows { display: grid; gap: 10px; }
  .rp-sb-row { display: grid; grid-template-columns: 5.5em 1fr auto; align-items: center; gap: 8px; }
  .rp-sb-name { font-size: 12px; letter-spacing: .06em; color: var(--c-mid); }
  .rp-sb-bar {
    position: relative; height: var(--rp-sb-bar-h);
    background: rgba(255, 255, 255, .07);
    background-image: repeating-linear-gradient(90deg, transparent 0 calc(25% - 1px), var(--c-ink) calc(25% - 1px) 25%);
    border: 1px solid var(--c-line);
    overflow: hidden;
  }
  .rp-sb-fill { display: block; height: 100%; width: 0; background: var(--c-accent); transition: width 320ms cubic-bezier(.25, .46, .45, .94); }
  .rp-sb-val { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 12px; min-width: 4.5em; text-align: right; color: #dfe3df; }
  .rp-sb-delta { font-size: 11px; margin-left: 4px; color: var(--c-mid); }
  .rp-sb-row.is-warn .rp-sb-fill { background: var(--c-warn); }
  .rp-sb-row.is-danger .rp-sb-fill { background: var(--c-danger); }
  .rp-sb-row.is-danger .rp-sb-val { color: var(--c-danger); font-weight: 600; }
  .rp-sb-row.is-danger .rp-sb-name::after { content: " ▮"; color: var(--c-danger); }
  .rp-sb-row.is-danger .rp-sb-bar { animation: rp-sb-pulse 2.4s ease-in-out infinite; }
  @keyframes rp-sb-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .58; } }
  /* 预览画布 */
  body.rp-preview { margin: 0; padding: 32px 16px 48px; background: #0b0d0e;
    background-image: radial-gradient(120% 55% at 50% 0, rgba(217, 178, 106, .14), transparent 70%);
    background-repeat: no-repeat; background-attachment: fixed; }
  .rp-preview-tag { max-width: var(--canvas-w, 700px); margin: 0 auto 8px; font: 11px/1 ui-monospace, Consolas, monospace; letter-spacing: .1em; color: #6f7276; }
  .rp-preview .rp-sb { max-width: var(--canvas-w, 700px); margin: 0 auto; }
  @media (prefers-reduced-motion: reduce) {
    .rp-sb-fill { transition: none; }
    .rp-sb-row.is-danger .rp-sb-bar { animation: none; }
  }
  @media (max-width: 420px) {
    .rp-sb-row { grid-template-columns: 4.5em 1fr auto; gap: 6px; }
  }
</style>
</head>
<body>
<div class="rp-sb" id="rp-sb-root"></div>
<script>
(function () {
  'use strict';

  /* ==== 四栏声明（frontend-interaction.md 第一节）==== */
  var READS   = [{ source: 'mvux', path: 'stat_data.灯芯', when: '每轮渲染' }];
  var WRITES  = [];                     // 状态栏只读；写数据归控制中心
  var LISTENS = ['CHARACTER_MESSAGE_RENDERED', 'MESSAGE_SWIPED', 'CHAT_CHANGED'];
  var NEEDS   = ['getChatMessages', 'getCurrentMessageId', 'eventOn'];

  var HIDE_UNKNOWN = true;            // 值为 未知 时整条隐去；false 则显示灰条 + 未知

  /* kind: 'text' 进抬头信息条；'bar' 进数值行
     dir:  'up' 值越高越好；'down' 值越高越危险；'none' 不上色
     warn / danger: 危险区起点（按 dir 判断方向），不给就不上色
     range 抄 axis-system.yaml 的对应轴 range */
  var FIELDS = [
    { name: '时间', kind: 'text' },
    { name: '地点', kind: 'text' },
    { name: '灯芯', kind: 'bar', min: 0, max: 100, dir: 'down', warn: 34, danger: 15, unit: '' },
    { name: '潮压', kind: 'bar', min: 0, max: 100, dir: 'up', warn: 60, danger: 82, unit: '', decimals: 0 }
  ];

  var ROOT = document.getElementById('rp-sb-root');
  var NUM_RE = /^-?\d+(?:\.\d+)?$/;

  /* 预览守卫：楼层 iframe 里 self !== top；直接打开预览副本时 self === top */
  var RP_PREVIEW = (function () {
    try { return window.self === window.top; } catch (e) { return false; }
  })();
  var MOCK_STATE = {
    时间: '潮历四十七年 · 第三次涨潮 · 夜',
    地点: '第七塔 · 塔顶灯室',
    灯芯: '18',
    潮压: '87'
  };

  function esc(s) {

    // 实体一律用 \x26 拼：正文里的实体写法会被渲染管线多吃掉一层（见 frontend-conventions 三之一）
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '\x26amp;', '<': '\x26lt;', '>': '\x26gt;', '"': '\x26quot;', "'": '\x26#39;' }[c];
    });
  }

  function snapshot(id) {
    if (id < 0) return null;
    var saved = Mvu.getMvuData({ type: 'message', message_id: id });
    var state = saved && saved.stat_data;
    if (!state) return null;
    var world = state.世界 || {};
    var actor = (state.角色 || {}).祁昭 || {};
    return {
      时间: [world.日期, world.时段].filter(Boolean).join(' · '),
      地点: world.地点 || '',
      灯芯: actor.wick == null ? '' : String(actor.wick),
      潮压: actor.tide == null ? '' : String(actor.tide)
    };
  }

  function fmt(n, f) {
    var d = f.decimals == null ? (Math.abs(n) >= 10 || n % 1 === 0 ? 0 : 1) : f.decimals;
    return n.toFixed(d) + (f.unit || '');
  }

  function zone(f, v) {
    if (f.dir === 'none' || f.warn == null) return '';
    if (f.dir === 'down') {
      if (f.danger != null && v <= f.danger) return ' is-danger';
      if (v <= f.warn) return ' is-warn';
      return '';
    }
    if (f.danger != null && v >= f.danger) return ' is-danger';
    if (v >= f.warn) return ' is-warn';
    return '';
  }

  function deltaHtml(f, v, prev) {
    if (!prev || prev[f.name] == null || !NUM_RE.test(prev[f.name])) return '';
    var p = parseFloat(prev[f.name]);
    var d = v - p;
    if (Math.abs(d) < 1e-9) return '';
    var arrow = d > 0 ? '↑' : '↓';
    return '<span class="rp-sb-delta">' + arrow + esc(fmt(Math.abs(d), f)) + '</span>';
  }

  function render() {
    var id = RP_PREVIEW ? 0 : getCurrentMessageId();
    var data = RP_PREVIEW ? MOCK_STATE : snapshot(id);
    if (!data) { ROOT.innerHTML = ''; return; }

    var prev = RP_PREVIEW ? null : snapshot(id - 1);
    var meta = [];
    var rows = [];

    FIELDS.forEach(function (f) {
      var raw = data[f.name];
      if (f.kind === 'text') {
        if (raw) meta.push('<span>' + esc(raw) + '</span>');
        return;
      }
      var known = raw !== '' && NUM_RE.test(raw);
      if (raw === '未知' || raw === '') {
        if (HIDE_UNKNOWN) return;
        rows.push('<div class="rp-sb-row"><span class="rp-sb-name">' + esc(f.name) +
          '</span><div class="rp-sb-bar"><span class="rp-sb-fill" style="width:0"></span></div>' +
          '<span class="rp-sb-val">未知</span></div>');
        return;
      }
      if (!known) {
        rows.push('<div class="rp-sb-row"><span class="rp-sb-name">' + esc(f.name) +
          '</span><div class="rp-sb-bar"><span class="rp-sb-fill" style="width:0"></span></div>' +
          '<span class="rp-sb-val">' + esc(raw) + '</span></div>');
        return;
      }
      var v = parseFloat(raw);
      var span = f.max - f.min || 1;
      var pct = Math.max(0, Math.min(100, ((v - f.min) / span) * 100));
      rows.push('<div class="rp-sb-row' + zone(f, v) + '">' +
        '<span class="rp-sb-name">' + esc(f.name) + '</span>' +
        '<div class="rp-sb-bar"><span class="rp-sb-fill" style="width:' + pct.toFixed(1) + '%"></span></div>' +
        '<span class="rp-sb-val">' + esc(fmt(v, f)) + deltaHtml(f, v, prev) + '</span></div>');
    });

    ROOT.innerHTML =
      (meta.length ? '<div class="rp-sb-meta">' + meta.join('') + '</div>' : '') +
      (rows.length ? '<div class="rp-sb-rows">' + rows.join('') + '</div>' : '');
  }

  // 预览副本：插画布标签后直接渲染，不碰 Mvu
  if (RP_PREVIEW) {
    document.body.classList.add('rp-preview');
    var w = '';
    try { w = new URLSearchParams(location.search).get('w') || ''; } catch (e) {}
    if (w && /^\d+$/.test(w)) document.body.style.setProperty('--canvas-w', w + 'px');
    var tag = document.createElement('div');
    tag.className = 'rp-preview-tag';
    tag.textContent = '预览 ' + (w && /^\d+$/.test(w) ? w : 700) + 'px · 正式聊天里不显示这行';
    document.body.insertBefore(tag, ROOT);
    render();
  } else if (typeof waitGlobalInitialized === 'function') {
    // MVU 写回本楼后会刷新该楼，刷新时重新读取本楼快照。
    waitGlobalInitialized('Mvu').then(render).catch(function () { ROOT.textContent = '变量暂不可用'; });
  }

})();
</script>
</body>
</html>
