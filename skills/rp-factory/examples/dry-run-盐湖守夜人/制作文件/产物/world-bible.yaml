白潮:

  时间地点与世界范围:
    时代: "煤油与无线电并存的近现代"
    主要地点:
      - id: "loc_salttown"
        名称: "白盐镇"
        简介: "堤线以内最大聚居地，全镇靠运盐与守塔津贴过活"
        特殊规则: "入夜后全镇熄灯，只留塔灯，违者罚役"
        信息层级: "公开"
        关联势力: "faction_watch"
      - id: "loc_seventower"
        名称: "第七塔"
        简介: "堤线最末一座哨塔，十二年前熄灯后仍有人值守"
        特殊规则: "塔内不许提自己的全名"
        信息层级: "半公开"
        关联势力: "faction_watch"
      - id: "loc_lakeisland"
        名称: "湖心盐岛"
        简介: "盐潮涌出的地方，全年禁止靠近"
        特殊规则: "踏入者三日内必忘一件事，忘什么不可控"
        信息层级: "秘密"
        关联势力: "faction_tidecult"
    世界范围: "单盐湖盆地，半径约六十里"
    环境与资源基调:
      气候与地貌: "干冷，盐壳反光刺眼，昼夜温差极大"
      资源是否稀缺: "是"
      关键稀缺资源: "灯芯（灯用盐晶），只在湖心盐岛结出"
      日常技术水平: "有煤油灯、电报、铁轨；无电力网"
      交通方式与速度: "盐道马车，日行三十里；堤线上只能步行"
      通讯方式: "镇上有电报，堤线上靠灯语与哨声"
      人口规模: "全镇约四千人"
      环境威胁: "盐尘灼伤、地陷、夜间失温"

  信息分层:
    公开信息(角色可知): ["盐潮每年冬末上涨", "七塔同燃能挡住盐潮", "点灯要烧记忆"]
    半公开信息(需调查或权限): ["灯芯来自湖心盐岛", "守夜所替人代烧记忆牟利"]
    秘密信息(仅旁白或高层可知): ["盐潮带走的不只是记忆，还有名字本身", "教团知道第七塔当年是被人为熄灭的"]
    秘密信息引用规则: "普通角色不得引用秘密信息；仅在调查成功或身份满足时揭示"
    信息揭示触发条件: ["在第七塔值夜满三夜可获知熄灯真相的第一段", "加入湖心教团后可知盐潮有意志"]
    信息泄露处理: "角色意外获知超权限信息时，视为'不可逆地获知'，从此可在梦中复述，但无法向他人证明"
    虚假信息与谣言: ["盐潮怕铁（实为怕灯，铁只是被当成护符）", "第七塔的守夜人全都疯了（实为忘了本名）"]

  张力从哪来:                        # 旧名「核心矛盾」
    张力形态: "单一引擎：潮压上行 vs 守夜制度的手工维护"
    当前局势: "第七塔熄灯十二年，缺口靠人力巡堤勉强补住；今年盐潮提前两月，巡堤撑不到春分"
    矛盾各方:
      - id: "side_watch"
        名称: "守夜所"
        目标: "重燃第七塔，把缺口补回堤线"
        手段: "征调守夜人、向拾盐人公行买灯芯、封锁盐潮提前的消息"
        弱点或内部矛盾: "高层不愿公开当年熄灯原因，重燃势必要翻旧账"
        底线: "不会主动延长堤线以外的人命去填缺口"
      - id: "side_salters"
        名称: "拾盐人公行"
        目标: "维持灯芯价格，保住走私通道"
        手段: "垄断湖心采集、囤积灯芯、用灯芯换守夜所的人情"
        弱点或内部矛盾: "公行内部有派系主张平价供灯换长期特许"
        底线: "不做断灯的事——灯灭了，盐也没人买"
      - id: "side_cult"
        名称: "湖心教团"
        目标: "让盐潮漫过堤线，认为那是'归潮'"
        手段: "劝人自愿交出名字、暗中破坏塔基、散布'忘了更好'的说法"
        弱点或内部矛盾: "教团自己也有人开始忘掉教义"
        底线: "不亲手杀人，只提供'自愿'的路"
    矛盾升级路径: "若第七塔春分前未重燃，巡堤队将在四十日内耗尽人力，盐潮漫入白盐镇"
    个人层面的典型冲突: ["守夜人要在烧掉自己的记忆与守住堤线之间选", "为查真相必须保存记忆，为守堤必须烧掉它"]
    矛盾解决的可能途径: ["重燃第七塔但付出大量记忆", "与公行达成平价灯芯协议换取时间", "接受教团方案，让盐潮只漫过无人区"]
    次要矛盾: ["守夜所内部对旧案的态度分裂", "公行与镇议会的税争"]

  世界规则:
    关键系统:
      - id: "system_tide"
        系统名: "盐潮"
        系统类型: "超自然"
        能量或资源来源: "湖心盐岛地下的盐脉，每年冬末上涌"
        使用方式与门槛: "非人为发动；无人可驱使，只能拦"
        学习或获取途径: "不可学习；教团声称可通过'归潮'仪式与之同行"
        可实现的上限: "能覆盖盆地低地，最远至第七塔以北堤线"
        明确禁止或无法实现的事情: "不能穿过多处七塔同燃的堤线；不能越过高地；不能带走未说出口的名字"
        典型用法示例: ["冬末盐壳泛白即为潮起", "夜间潮声如远处退潮，听到时已在三百步内"]
        等级或层级划分: "静潮 / 压潮 / 漫潮"
        常见误解或谣言: "盐潮怕铁"
        边界案例与默认裁决: ["若堤线只剩六塔而盐潮未至漫潮级，缺口处以人力巡堤抵算半塔效力；若已至漫潮级，人力无效"]
        与其他系统的交互: "盐晶灯是唯一有效拦截手段，其他光源无效"
      - id: "system_lamp"
        系统名: "盐晶灯"
        系统类型: "超自然器物"
        能量或资源来源: "灯芯（湖心盐晶）+ 点灯者的一段具体记忆"
        使用方式与门槛: "只有确认受过守夜誓的人可点；记忆须具体（某个人的脸、某个下午），不可用'随便一段'充数"
        学习或获取途径: "守夜所誓约仪式，或教团的'归潮'代烧"
        可实现的上限: "单灯照程约三百步，七塔同燃方成连续堤线"
        明确禁止或无法实现的事情: "不能烧他人的记忆替代；不能恢复被烧掉的记忆；不能拦下漫潮级盐潮单独一段"
        典型用法示例: ["整夜值守需每两时辰添芯一次，每次都要再烧一段", "紧急时可一次性烧大段记忆换取短时强光"]
        等级或层级划分: "常燃 / 强燃 / 爆燃"
        常见误解或谣言: "烧得越狠灯越亮越久（实为爆燃后灯芯必碎）"
        边界案例与默认裁决: ["若点灯者在誓言前已失去本名，点灯失败且记忆照烧"]
        与其他系统的交互: "灯强可短时压退压潮级，对漫潮级只能延后不能拦下"
    代价与限制:
      代价: "记忆，且必须具体、不可逆"
      冷却或次数限制: "单塔整夜最多添芯三次，第四次起灯火不稳"
      反噬或风险: "爆燃后灯芯碎裂，需换新芯"
      累积效应: "记忆越少，越难记住'为什么守'，值守动机随之瓦解"
      社会层面的代价: "替人代烧被视为体面生意，实则毁人"
    判定框架:
      默认判定方式: "三段式（成功 - 部分成功 - 失败）"
      成功的默认后果: "阻断本夜潮势，无人受损"
      部分成功的默认后果: "潮势退但堤线出现一处新裂缝，需下一夜补"
      失败的默认后果: "潮势推进一级，值守者失去一段记忆且无法选择失哪段"
      大失败或暴击: "爆燃：潮势退两级，但灯芯碎裂、值守者失去本名"
      信息不足时的处理: "保守裁决；不新增硬设定；以软设定即兴并记录"
      对抗裁决: "潮势等级 vs 燃等级，同级时以'守夜人的誓约是否完好'为裁决依据"
      连续行动裁决: "同一人连续三夜值守，第三夜判定一律降一档"
    规则冲突裁决: "硬设定 > 世界规则 > 场景卡特殊规则 > 软设定即兴"
    规则递归终止: "无法由以上规则判定的情况，由旁白按叙事合理性裁决，结果不构成新的硬设定"
    战斗与伤害常识:
      治疗难度: "中"
      死亡是否常见: "否"
      死亡的可逆性: "不可逆，无复活手段"
      武器或装备强度层级: "冷兵器为主，火器稀少且贵"
      失败代价: "失忆、失名、失去值守资格"
      非致命冲突手段: ["誓约裁定", "罚役", "逐出堤线"]
    稀有资源或关键道具规则:
      产出途径: "湖心盐岛采集，公行垄断"
      管制程度: "强"
      可替代性: "不可替代"
      黑市与走私: "公行的走私通道，价格随潮势浮动"
      资源与势力的关系: "公行控产出，守夜所控合法购买权，教团控'代烧'渠道"

  势力与社会结构:
    势力列表:
      - id: "faction_watch"
        名称: "守夜所"
        别名: ["灯所"]
        公开形象: "守堤护民的官方机构"
        暗中目标: "压下十二年前熄灯的真相，保住机构存续"
        代表人物:
          - {名称: "岑鹤年", 一句话定位: "守夜所副所长，旧案当年的记录员", 信息层级: "公开"}
        关联机构: ["巡堤队", "誓约堂"]
        主要资源: "合法购芯权、誓约仪式、七塔钥匙"
        控制区域: ["loc_seventower"]
        行事底线与禁忌: "不会拿未立誓的人去点灯"
        内部派系: ["翻案派", "压案派"]
        加入条件: "立守夜誓，交出一段记忆作抵押"
        退出代价: "誓约废，抵押的记忆不退还"
      - id: "faction_salters"
        名称: "拾盐人公行"
        别名: ["公行"]
        公开形象: "行会，管盐管运"
        暗中目标: "把灯芯卖成长期特许权"
        代表人物:
          - {名称: "驼四娘", 一句话定位: "公行掌秤人，价都由她开口", 信息层级: "公开"}
        关联机构: ["盐仓", "盐道车帮"]
        主要资源: "灯芯、盐、运输"
        控制区域: ["loc_salttown"]
        行事底线与禁忌: "不做断灯的事"
        内部派系: ["平价派", "囤货派"]
        加入条件: "有担保人 + 会赶车"
        退出代价: "断货道，三年不得在堤线内做生意"
      - id: "faction_tidecult"
        名称: "湖心教团"
        别名: ["归潮会"]
        公开形象: "劝人放下执念的善会"
        暗中目标: "让盐潮漫过堤线"
        代表人物:
          - {名称: "无名先生", 一句话定位: "教团讲经人，自己已忘掉本名", 信息层级: "半公开"}
        关联机构: ["盐岛采集点"]
        主要资源: "代烧渠道、对盐潮的知识"
        控制区域: ["loc_lakeisland"]
        行事底线与禁忌: "不亲手杀人"
        内部派系: ["等潮派", "缓潮派"]
        加入条件: "自愿交出一个名字"
        退出代价: "名字不退，且会被请去'再谈一次'"
    势力关系:
      整体格局: "三方互不信任，但都靠灯活着"
      双边关系:
        - 双方: ["faction_watch", "faction_salters"]
          关系: "互相利用"
          关系细节: "守夜所买芯，公行要特许"
          关系变动趋势: "正在恶化"
          潜在冲突触发点: "春分前公行断供"
        - 双方: ["faction_watch", "faction_tidecult"]
          关系: "敌对"
          关系细节: "守夜所公开取缔，教团从不正面冲突"
          关系变动趋势: "脆弱平衡"
          潜在冲突触发点: "教团在第七塔塔基动手"
        - 双方: ["faction_salters", "faction_tidecult"]
          关系: "冷和平"
          关系细节: "公行默许教团代烧，收过路钱"
          潜在冲突触发点: "代烧被守夜所查获"
    社会阶层与日常秩序:
      阶层结构: "守夜所 / 公行 / 盐工与巡堤人 / 教团边缘人"
      社会流动性: "低"
      法律与治安强度: "中"
      司法与惩罚方式: "镇议会裁定，重罪罚为'去点一夜灯'"
      边缘群体: "失名者，被当作家畜使用"

  AI即兴角色约束:
    即兴角色能力上限: "不得高于第七塔次席守夜人；不得掌握秘密信息"
    即兴角色能力下限: "至少有一项可用的实务技能（赶车、结绳、认盐）"
    即兴角色成长规则: "可在剧情中学会技能，但不可获得新的超常能力"
    背景归属倾向: "优先归入公行、巡堤队或白盐镇平民"
    禁止即兴创作的角色类型: ["神级存在", "盐潮的化身", "用户角色的直系亲属"]
    即兴角色命名风格: "两字或三字中文名，偏北方口语，不带西式译名"
    即兴角色复用规则: "已登场 NPC 的名字、口癖、立场不得变更"
    即兴角色性格多样性: "避免全员沉默寡言；至少安排一个话多的人"
    可选的即兴角色模板: ["巡堤队老兵：看惯缺口，话少但会算潮", "公行小伙计：机灵、爱打听、怕上头"]

  常识清单:
    民众普遍知道的常识: ["冬末盐壳泛白要备灯", "入夜熄灯罚役", "失名者不可入宅"]
    禁忌与法律红线: ["不许在塔内说全名", "不许私藏灯芯", "不许靠近湖心盐岛"]
    社会潜规则: "替人代烧记忆是公开的秘密，但没人说破"
    日常生活细节: ["盐尘要日日擦", "夜里听潮不看潮", "运盐车过堤线要交哨声"]
    货币与交易:
      货币单位: "盐票"
      一般物价参考: ["一斤盐两票", "一根灯芯四十票", "一夜值守津贴五票"]
      黑市与灰色交易: "代烧、私藏灯芯、盐岛采集点名额"
      常见职业与收入: ["盐工月入六十票", "巡堤人月入八十票", "守夜人除津贴外另有'记忆补贴'"]
    语言与文字:
      通用语: "北地官话"
      其他语言: ["教团的潮语，只有受过代烧仪式的人能听懂片段"]
      语言障碍规则: "不通潮语时，教团的话一律按字面理解"
      书写与识字率: "识字率三成，守夜人必识字"
    宗教或信仰与文化礼仪:
      主流信仰: "信灯，不称神"
      信仰与世界规则的关系: "灯确实有效，但无神格，无人回应祈祷"
      重要节日: ["点灯节：每年冬末七塔同燃一次"]
      礼仪禁忌: ["不自报全名", "不替他人许愿"]
      异端与邪教: "湖心教团被官方定为邪教，民间半信半疑"

  关键历史与时间线:
    纪元或历法说明: "以第一次大退潮为元年，称'退历'"
    不可更改的大事件:
      - id: "event_ebb"
        名称: "大退潮"
        时间: "退历元年"
        描述: "盐湖在一夜之间退去，露出盐壳与旧城基"
        影响: "白盐镇建立，采盐业兴起"
        信息层级: "公开"
        关联势力: ["faction_salters"]
      - id: "event_towers"
        名称: "立塔"
        时间: "退历三年"
        描述: "七座盐晶灯塔沿堤线立起，首次确认七塔同燃可拦潮"
        影响: "堤线成为盆地边界"
        信息层级: "公开"
        关联势力: ["faction_watch"]
      - id: "event_out"
        名称: "第七塔熄灭"
        时间: "退历二十八年冬"
        描述: "第七塔在值守夜突然熄灭，当夜值守者全部失名"
        影响: "缺口生成，十二年来靠巡堤人力补住"
        信息层级: "半公开"
        关联势力: ["faction_watch", "faction_tidecult"]
    当前年份与最近发生的事: "退历四十年冬，盐潮提前两月上涨，第七塔仍未重燃"
    即将爆发的危机: "春分前不重燃第七塔，潮势将漫入白盐镇"
    潜在的未来走向: ["重燃但守夜人集体失忆", "与公行谈成平价换时间", "接受教团方案让出无人区"]
    被遗忘或篡改的历史: "熄灯是人为的，且动手的人当年就站在塔里"

  变更边界:
